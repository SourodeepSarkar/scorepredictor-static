            '<div class="lb-pts">' + (u.total_points || 0) + '</div>' +
            '<div class="lb-num">' + (u.exact || 0) + '</div>' +
            '<div class="lb-num">' + (u.correct || 0) + '</div>' +
            '</div>';
        });
        html += '</div>' +
          '<div class="rules-box">' +
          '<div class="rules-title">How It Works</div>' +
          '<table class="rules-table"><thead><tr><th>Event</th><th class="pts-col">Points</th></tr></thead>' +
          '<tbody>' +
          '<tr><td>Exact score</td><td class="pts-col"><span class="green-pts">3</span></td></tr>' +
          '<tr><td>Correct result (win/draw/loss)</td><td class="pts-col"><span class="blue-pts">1</span></td></tr>' +
          '<tr><td>Wrong prediction</td><td class="pts-col"><span class="grey-pts">0</span></td></tr>' +
          '</tbody></table>' +
          '<div class="rules-divider"></div>' +
          '<div class="rules-sub">Tiebreakers in order</div>' +
          '<ol class="rules-list"><li>More exact scores (3-pt calls)</li><li>Alphabetical order of name</li></ol>' +
          '<div class="rules-divider"></div>' +
          '<div class="rules-list-item">Predictions lock <strong>60 minutes</strong> after kickoff — submit early!</div>' +
          '</div>';
        document.getElementById('lbList').innerHTML = html;
      }
      function renderLeaderboard() {
        if (lbInitialized) return;
        lbInitialized = true;
        renderLBSkeleton();
        fetch(API + '/leaderboard')
          .then(res => res.json())
          .then(data => {
            if (!Array.isArray(data)) return;
            lastLBJson = JSON.stringify(data);
            renderLBData(data);
          })
          .catch(() => {
            document.getElementById('lbList').innerHTML = '<div class="state-msg">Could not load leaderboard.</div>';
            lbInitialized = false;
          });
      }
      function renderLBSkeleton() {
        var rows = Array.from({ length: 7 }, () =>
          '<div class="sk-lb-row"><div class="skel sk-rank"></div><div class="skel sk-name"></div><div class="skel sk-pts"></div><div class="skel sk-stat"></div><div class="skel sk-stat"></div></div>'
        ).join('');
        document.getElementById('lbList').innerHTML =
          '<div class="lb-wrap"><div class="lb-title-row"><div class="lb-title">Standings</div></div>' +
          '<div class="lb-header-row"><div></div><div>Player</div><div>Pts</div><div>Exact</div><div>Result</div></div>' +
          rows + '</div>';
      }

      // ── STATS TAB ───────────────────────────────────────────────────────────
      function computeStats() {
        const finishedMatches = matches.filter(m => m.status === 'FINISHED');
        const totalMatches = matches.length;
        let totalPredictions = 0;
        let exactCount = 0, resultCount = 0, missCount = 0, noPickCount = 0;
        let totalPredHomeGoals = 0, totalPredAwayGoals = 0, totalActualHomeGoals = 0, totalActualAwayGoals = 0;
        const scorelineMap = {}; // "h-a" -> count (predictions)
        const playerStats = {}; // user_id -> { name, predictions, exact, correct, miss, points, predGoals, totalGoalsByMatch }
        users.forEach(u => {
          playerStats[u.user_id] = { name: u.display_name, predictions: 0, exact: 0, correct: 0, miss: 0, points: 0, predGoalsTotal: 0 };
        });

        // cumulative for line chart
        const sortedMatches = [...matches].sort((a, b) => {
          const ka = parseUTC(a.kickoff)?.getTime() || 0;
          const kb = parseUTC(b.kickoff)?.getTime() || 0;
          return ka - kb;
        });

        const cumulative = {}; // user_id -> [{matchIdx, points}]
        users.forEach(u => { cumulative[u.user_id] = []; });
        const matchTimeline = []; // labels for x axis
        let runningTotals = {}; users.forEach(u => runningTotals[u.user_id] = 0);

        sortedMatches.forEach((m, idx) => {
          if (m.status !== 'FINISHED') return;
          matchTimeline.push({ idx, matchId: m.match_id, label: (m.team_home || '').slice(0, 3).toUpperCase() + ' v ' + (m.team_away || '').slice(0, 3).toUpperCase() });
          users.forEach(u => {
            const pred = m.predictions ? m.predictions[u.user_id] : null;
            if (pred && pred.points !== undefined && pred.points !== null) {
              runningTotals[u.user_id] += pred.points;
            }
            cumulative[u.user_id].push({ idx: matchTimeline.length - 1, total: runningTotals[u.user_id] });
          });
        });

        // overall counts
        matches.forEach(m => {
          const isFinished = m.status === 'FINISHED';
          if (isFinished && m.score_home !== undefined && m.score_away !== undefined && m.score_home !== null && m.score_away !== null) {
            totalActualHomeGoals += +m.score_home;
            totalActualAwayGoals += +m.score_away;
          }
          users.forEach(u => {
            const pred = m.predictions ? m.predictions[u.user_id] : null;
            if (pred && pred.pred_home !== undefined && pred.pred_away !== undefined && pred.pred_home !== null && pred.pred_away !== null) {
              totalPredictions++;
              totalPredHomeGoals += +pred.pred_home;
              totalPredAwayGoals += +pred.pred_away;
              playerStats[u.user_id].predictions++;
              playerStats[u.user_id].predGoalsTotal += (+pred.pred_home + +pred.pred_away);
              const key = pred.pred_home + '-' + pred.pred_away;
              scorelineMap[key] = (scorelineMap[key] || 0) + 1;
              if (isFinished) {
                if (pred.points === 3) { exactCount++; playerStats[u.user_id].exact++; }
                else if (pred.points === 1) { resultCount++; playerStats[u.user_id].correct++; }
                else { missCount++; playerStats[u.user_id].miss++; }
                playerStats[u.user_id].points += (pred.points || 0);
              }
            } else if (isFinished) {
              noPickCount++;
            }
          });
        });

        const finishedTotal = exactCount + resultCount + missCount + noPickCount;
        const avgPointsPerMatch = finishedMatches.length ? ((exactCount * 3 + resultCount) / finishedMatches.length).toFixed(2) : '0.00';

        return {
          totalPredictions,
          totalMatches,
          finishedMatches: finishedMatches.length,
          exactCount, resultCount, missCount, noPickCount, finishedTotal,
          avgPointsPerMatch,
          totalPredHomeGoals, totalPredAwayGoals, totalActualHomeGoals, totalActualAwayGoals,
          scorelineMap,
          playerStats,
          cumulative,
          matchTimeline
        };
      }

      function renderKPIs(s) {
        const totalGoalsPredicted = s.totalPredHomeGoals + s.totalPredAwayGoals;
        const avgGoals = s.totalPredictions ? (totalGoalsPredicted / s.totalPredictions).toFixed(2) : '0.00';
        return `<div class="stats-kpi-grid">
        <div class="kpi-card green">
          <div class="kpi-label">Total Picks</div>
          <div class="kpi-value">${s.totalPredictions}</div>
          <div class="kpi-sub">across all players</div>
        </div>
        <div class="kpi-card blue">
          <div class="kpi-label">Matches</div>
          <div class="kpi-value">${s.finishedMatches}<span style="font-size:1rem;color:var(--ink4);font-weight:700">/${s.totalMatches}</span></div>
          <div class="kpi-sub">played / total</div>
        </div>
        <div class="kpi-card gold">
          <div class="kpi-label">Exact Hits</div>
          <div class="kpi-value">${s.exactCount}</div>
          <div class="kpi-sub">3-point calls</div>
        </div>
        <div class="kpi-card purple">
          <div class="kpi-label">Avg Goals/Pick</div>
          <div class="kpi-value">${avgGoals}</div>
          <div class="kpi-sub">predicted per match</div>
        </div>
      </div>`;
      }

      function renderHorizontalBars(s) {
        const players = Object.values(s.playerStats).sort((a, b) => b.points - a.points);
        if (!players.length) return '';
        const max = Math.max(...players.map(p => p.points), 1);
        const rows = players.map(p => {
          const pct = (p.points / max) * 100;
          return `<div class="hbar-row">
          <div class="hbar-name">${escHtml(p.name)}</div>
          <div class="hbar-track"><div class="hbar-fill" style="width:${pct}%"></div></div>
          <div class="hbar-val">${p.points}</div>
        </div>`;
        }).join('');
        return `<div class="stats-card">
        <div class="stats-card-header">
          <div class="stats-card-title">Points by Player</div>
          <div class="stats-card-sub">Total points earned this tournament</div>
        </div>
        <div class="stats-card-body">${rows}</div>
      </div>`;
      }

      function renderPredictionsBars(s) {
        const players = Object.values(s.playerStats).sort((a, b) => b.predictions - a.predictions);
        if (!players.length) return '';
        const max = Math.max(...players.map(p => p.predictions), 1);
        const totalPossible = s.totalMatches;
        const rows = players.map(p => {
          const pct = (p.predictions / max) * 100;
          const partRate = totalPossible ? Math.round((p.predictions / totalPossible) * 100) : 0;
          return `<div class="hbar-row">
          <div class="hbar-name">${escHtml(p.name)}</div>
          <div class="hbar-track"><div class="hbar-fill blue" style="width:${pct}%"></div></div>
          <div class="hbar-val">${p.predictions} <span style="color:var(--ink4);font-weight:500;font-size:0.75rem">${partRate}%</span></div>
        </div>`;
        }).join('');
        return `<div class="stats-card">
        <div class="stats-card-header">
          <div class="stats-card-title">Predictions Submitted</div>
          <div class="stats-card-sub">Participation level — % of all matches predicted</div>
        </div>
        <div class="stats-card-body">${rows}</div>
      </div>`;
      }

      function renderHitRateDonut(s) {
        const total = s.exactCount + s.resultCount + s.missCount + s.noPickCount;
        if (!total) return '';
        const segs = [
          { label: 'Exact (3pt)', val: s.exactCount, color: '#1a5c2a' },
          { label: 'Result (1pt)', val: s.resultCount, color: '#1a3a6b' },
          { label: 'Miss (0pt)', val: s.missCount, color: '#c0392b' },
          { label: 'No pick', val: s.noPickCount, color: '#a8a39a' }
        ];
        const r = 60, cx = 80, cy = 80, stroke = 22;
        const C = 2 * Math.PI * r;
        let acc = 0;
        const paths = segs.map(seg => {
          const frac = seg.val / total;
          const len = frac * C;
          const dasharray = `${len} ${C - len}`;
          const offset = -acc;
          acc += len;
          return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${stroke}" stroke-dasharray="${dasharray}" stroke-dashoffset="${offset}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
        }).join('');
        const legend = segs.map(seg => {
          const pct = total ? Math.round((seg.val / total) * 100) : 0;
          return `<div class="donut-legend-row">
          <div class="donut-dot" style="background:${seg.color}"></div>
          <div class="donut-legend-label">${seg.label}</div>
          <div class="donut-legend-val">${seg.val}</div>
          <div class="donut-legend-pct">${pct}%</div>
        </div>`;
        }).join('');
        return `<div class="stats-card">
        <div class="stats-card-header">
          <div class="stats-card-title">Hit Rate Breakdown</div>
          <div class="stats-card-sub">All predictions across finished matches</div>
        </div>
        <div class="stats-card-body">
          <div class="donut-wrap">
            <svg class="donut-svg" viewBox="0 0 160 160">
              ${paths}
              <text x="80" y="78" text-anchor="middle" font-family="Barlow Condensed" font-weight="900" font-size="22" fill="#0e0e0e">${total}</text>
              <text x="80" y="96" text-anchor="middle" font-family="Barlow Condensed" font-weight="600" font-size="9" fill="#6e6760" letter-spacing="1">PICKS</text>
            </svg>
            <div class="donut-legend">${legend}</div>
          </div>
        </div>
      </div>`;
      }

      function renderStackedBars(s) {
        const players = Object.values(s.playerStats).sort((a, b) => b.points - a.points);
        if (!players.length) return '';
        const colors = { exact: '#1a5c2a', correct: '#1a3a6b', miss: '#c0392b' };
        const rows = players.map(p => {
          const total = p.exact + p.correct + p.miss;
          if (total === 0) {
            return `<div class="stacked-row">
            <div class="hbar-name">${escHtml(p.name)}</div>
            <div class="stacked-track"></div>
            <div class="hbar-val" style="color:var(--ink4);font-weight:500">—</div>
          </div>`;
          }
          const e = (p.exact / total) * 100, c = (p.correct / total) * 100, m = (p.miss / total) * 100;
          return `<div class="stacked-row">
          <div class="hbar-name">${escHtml(p.name)}</div>
          <div class="stacked-track">
            <div class="stacked-seg" style="width:${e}%;background:${colors.exact}" title="${p.exact} exact"></div>
            <div class="stacked-seg" style="width:${c}%;background:${colors.correct}" title="${p.correct} correct"></div>
            <div class="stacked-seg" style="width:${m}%;background:${colors.miss}" title="${p.miss} miss"></div>
          </div>
          <div class="hbar-val">${total}</div>
        </div>`;
        }).join('');
        return `<div class="stats-card">
        <div class="stats-card-header">
          <div class="stats-card-title">Per-Player Breakdown</div>
          <div class="stats-card-sub">Exact / Result / Miss across all picks</div>
        </div>
        <div class="stats-card-body">
          ${rows}
          <div class="stacked-legend">
            <div class="line-legend-item"><div class="donut-dot" style="background:${colors.exact}"></div>Exact (3pt)</div>
            <div class="line-legend-item"><div class="donut-dot" style="background:${colors.correct}"></div>Result (1pt)</div>
            <div class="line-legend-item"><div class="donut-dot" style="background:${colors.miss}"></div>Miss (0pt)</div>
          </div>
        </div>
      </div>`;
      }

      function renderLineChart(s) {
        const players = Object.values(s.playerStats);
        if (!players.length || !s.matchTimeline.length) {
          return `<div class="stats-card"><div class="stats-card-header"><div class="stats-card-title">Points Trend</div><div class="stats-card-sub">Cumulative points over completed matches</div></div><div class="stats-card-body"><div style="text-align:center;color:var(--ink4);font-family:Instrument Serif,serif;font-style:italic;padding:20px">No completed matches yet.</div></div></div>`;
        }
        const W = 600, H = 240, padL = 30, padR = 16, padT = 14, padB = 28;
        const innerW = W - padL - padR;
        const innerH = H - padT - padB;
        const N = s.matchTimeline.length;

        // Build per-user lines, sorted by total descending so top players draw last/on top
        const playerKeys = Object.keys(s.playerStats).sort((a, b) => s.playerStats[b].points - s.playerStats[a].points);
        let maxY = 1;
        playerKeys.forEach(uid => {
          s.cumulative[uid].forEach(pt => { if (pt.total > maxY) maxY = pt.total; });
        });
        // pad y a bit
        maxY = Math.ceil(maxY * 1.1) || 1;

        const xAt = i => padL + (N <= 1 ? innerW / 2 : (i / (N - 1)) * innerW);
        const yAt = v => padT + innerH - (v / maxY) * innerH;

        // grid lines (4 horizontal)
        const gridLines = [];
        for (let i = 0; i <= 4; i++) {
          const yVal = (maxY / 4) * i;
          const y = yAt(yVal);
          gridLines.push(`<line x1="${padL}" y1="${y}" x2="${padL + innerW}" y2="${y}" stroke="rgba(14,14,14,0.08)" stroke-width="1"/>`);
          gridLines.push(`<text x="${padL - 4}" y="${y + 3}" text-anchor="end" font-family="Barlow Condensed" font-size="9" fill="#6e6760">${Math.round(yVal)}</text>`);
        }

        const linesSvg = playerKeys.map((uid, idx) => {
          const color = PLAYER_COLORS[idx % PLAYER_COLORS.length];
          const data = s.cumulative[uid];
          if (!data.length) return '';
          const path = data.map((pt, i) => `${i === 0 ? 'M' : 'L'}${xAt(pt.idx).toFixed(1)},${yAt(pt.total).toFixed(1)}`).join(' ');
          return `<path d="${path}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>`;
        }).join('');

        const xLabels = [];
        const labelStep = Math.max(1, Math.ceil(N / 6));
        for (let i = 0; i < N; i += labelStep) {
          xLabels.push(`<text x="${xAt(i)}" y="${H - 8}" text-anchor="middle" font-family="Barlow Condensed" font-size="9" fill="#6e6760">${escHtml(s.matchTimeline[i].label)}</text>`);
        }

        const legend = playerKeys.map((uid, idx) => {
          const color = PLAYER_COLORS[idx % PLAYER_COLORS.length];
          return `<div class="line-legend-item"><div class="line-legend-dash" style="background:${color}"></div>${escHtml(s.playerStats[uid].name)}</div>`;
        }).join('');

        return `<div class="stats-card">
        <div class="stats-card-header">
          <div class="stats-card-title">Points Trend</div>
          <div class="stats-card-sub">Cumulative points across completed matches</div>
        </div>
        <div class="stats-card-body">
          <svg class="line-chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
            ${gridLines.join('')}
            ${linesSvg}
            ${xLabels.join('')}
          </svg>
          <div class="line-legend">${legend}</div>
        </div>
      </div>`;
      }

      function renderScorelineHeatmap(s) {
        // Build a 6x6 grid (0-5 for both home and away)
        const max = 5;
        let topMax = 0;
        const grid = {};
        for (let h = 0; h <= max; h++) {
          for (let a = 0; a <= max; a++) {
            const k = h + '-' + a;
            const v = s.scorelineMap[k] || 0;
            grid[k] = v;
            if (v > topMax) topMax = v;
          }
        }
        // find top scoreline overall (any number)
        let topKey = null, topVal = 0;
        Object.keys(s.scorelineMap).forEach(k => { if (s.scorelineMap[k] > topVal) { topVal = s.scorelineMap[k]; topKey = k; } });

        function colorFor(v) {
          if (!v) return '#f5f0e8';
          const t = topMax ? v / topMax : 0;
          // interpolate paper -> green
          const r = Math.round(245 - (245 - 26) * t);
          const g = Math.round(240 - (240 - 92) * t);
          const b = Math.round(232 - (232 - 42) * t);
          return `rgb(${r},${g},${b})`;
        }

        let html = '<div class="hm-axis-label">Away score →</div><div class="heatmap-grid">';
        // header row
        html += '<div></div>';
        for (let a = 0; a <= max; a++) html += `<div class="hm-axis">${a}</div>`;
        for (let h = 0; h <= max; h++) {
          html += `<div class="hm-axis">${h}</div>`;
          for (let a = 0; a <= max; a++) {
            const v = grid[h + '-' + a];
            const fg = v && (v / Math.max(topMax, 1)) > 0.5 ? '#fff' : 'var(--ink2)';
            html += `<div class="hm-cell" style="background:${colorFor(v)};color:${fg}" title="${h}-${a}: ${v} picks">${v || ''}</div>`;
          }
        }
        html += '</div>';
        const sub = topKey
          ? `Most-picked scoreline: <strong>${topKey.replace('-', ' – ')}</strong> · ${topVal} time${topVal !== 1 ? 's' : ''}`
          : 'No predictions yet';
        return `<div class="stats-card">
        <div class="stats-card-header">
          <div class="stats-card-title">Scoreline Heatmap</div>
          <div class="stats-card-sub">${sub}</div>
        </div>
        <div class="stats-card-body">
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink4);margin-bottom:6px;text-align:left">↓ Home score</div>
          <div class="heatmap-wrap">${html}</div>
        </div>
      </div>`;
      }

      function renderGoalsComparison(s) {
        const players = Object.values(s.playerStats).filter(p => p.predictions > 0).sort((a, b) => (b.predGoalsTotal / Math.max(b.predictions, 1)) - (a.predGoalsTotal / Math.max(a.predictions, 1)));
        if (!players.length) return '';
        const max = Math.max(...players.map(p => p.predGoalsTotal / p.predictions), 1);
        const rows = players.map(p => {
          const avg = (p.predGoalsTotal / p.predictions);
          const pct = (avg / max) * 100;
          return `<div class="hbar-row">
          <div class="hbar-name">${escHtml(p.name)}</div>
          <div class="hbar-track"><div class="hbar-fill purple" style="width:${pct}%"></div></div>
          <div class="hbar-val">${avg.toFixed(2)}</div>
        </div>`;
        }).join('');
        const actualAvg = s.finishedMatches ? ((s.totalActualHomeGoals + s.totalActualAwayGoals) / s.finishedMatches).toFixed(2) : 'N/A';
        return `<div class="stats-card">
        <div class="stats-card-header">
          <div class="stats-card-title">Goal Optimism</div>
          <div class="stats-card-sub">Avg goals predicted per match · actual avg so far: <strong>${actualAvg}</strong></div>
        </div>
        <div class="stats-card-body">${rows}</div>
      </div>`;
      }

      function renderStats() {
        const container = document.getElementById('statsContent');
        if (!container) return;
        if (!users.length) {
          container.innerHTML = '<div class="state-msg">No data yet. Add players first.</div>';
          return;
        }
        const s = computeStats();
        let html = '';
        html += renderKPIs(s);
        html += renderHorizontalBars(s);
        html += renderLineChart(s);
        html += renderHitRateDonut(s);
        html += renderStackedBars(s);
        html += renderPredictionsBars(s);
        html += renderGoalsComparison(s);
        html += renderScorelineHeatmap(s);
        container.innerHTML = html;
        statsInitialized = true;
      }

      function savePred(input) {
        var matchId = input.dataset.matchid;
        var userId = input.dataset.userid;
        var side = input.dataset.side;
        var val = input.value.trim();
        if (!matchId || !userId || !side || val === '') return;
        var key = matchId + userId;
        if (!predBuffer[key]) {
          var inputs = input.closest('.pred-item').querySelectorAll('.pred-input');
          predBuffer[key] = {
            home: inputs[0].value.trim() !== '' ? parseInt(inputs[0].value, 10) : null,
            away: inputs[1].value.trim() !== '' ? parseInt(inputs[1].value, 10) : null
          };
        }
        predBuffer[key][side] = parseInt(val, 10);
        if (timers[key]) clearTimeout(timers[key]);
        timers[key] = setTimeout(function () {
          var buf = predBuffer[key];
          if (buf.home === null || buf.away === null) return;
          showToast('Saving…');
          fetch(API + '/predictions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: userId, match_id: parseInt(matchId, 10), pred_home: buf.home, pred_away: buf.away })
          }).then(r => r.json()).then(d => {
            if (d.status === 'saved') showToast('Saved ✓');
            else showToast(d.error || 'Error saving', true);
          }).catch(() => showToast('Network error', true));
        }, 500);
      }

      async function syncAll() {
        var btn = document.getElementById('syncBtn');
        var lbl = btn.querySelector('.btn-label');
        btn.disabled = true; btn.classList.add('spinning');
        if (lbl) lbl.textContent = 'Refreshing…';
        try {
          var data = await fetch(API + '/sync', { method: 'POST' }).then(r => r.json());
          showToast('Synced ' + data.count + ' match' + (data.count !== 1 ? 'es' : ''));
          const [mu, mm] = await Promise.all([
            fetch(API + '/users').then(r => r.json()),
            fetch(API + '/matches').then(r => r.json())
          ]);
          users = mu; matches = mm; sortUsers();
          patchMatchDOM(matches, mm, mu);
          if (document.getElementById('leaderboard').classList.contains('active')) { lbInitialized = false; renderLeaderboard(); }
          if (document.getElementById('stats').classList.contains('active')) renderStats();
        } catch (e) {
          console.error('[WC2026] sync failed:', e);
          showToast('Sync failed', true);
        } finally {
          btn.disabled = false; btn.classList.remove('spinning');
          if (lbl) lbl.textContent = 'Refresh Results';
        }
      }

      function showToast(msg, isError) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast' + (isError ? ' error' : '') + ' show';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
      }

      async function doPoll() {
        if (document.hidden || (document.activeElement && document.activeElement.classList.contains('pred-input'))) return;
        try {
          const [mu, mm] = await Promise.all([
            fetch(API + '/users').then(r => r.ok ? r.json() : null).catch(() => null),
            fetch(API + '/matches').then(r => r.ok ? r.json() : null).catch(() => null)
          ]);
          if (!mu || !mm || !Array.isArray(mu) || !Array.isArray(mm)) return;
          users = mu; matches = mm; sortUsers();
          patchMatchDOM(matches, mm, mu);
          if (document.getElementById('leaderboard').classList.contains('active')) {
            fetch(API + '/leaderboard').then(r => r.json()).then(data => {
              if (!Array.isArray(data)) return;
              const json = JSON.stringify(data);
              if (json === lastLBJson) return;
              lastLBJson = json;
              renderLBData(data);
            }).catch(() => { });
          }
          if (document.getElementById('stats').classList.contains('active')) renderStats();
        } catch (e) { }
      }
      let fastPoll = null;
      let slowPoll = null;
      let idleTimeout = null;
      function startFastPoll() { if (fastPoll) return; fastPoll = setInterval(doPoll, 20 * 60 * 1000); }
      function switchToSlowPoll() {
        if (fastPoll) { clearInterval(fastPoll); fastPoll = null; }
        slowPoll = setInterval(doPoll, 2 * 60 * 1000);
      }
      function resetIdleTimer() {
        clearTimeout(idleTimeout);
        if (slowPoll) { clearInterval(slowPoll); slowPoll = null; startFastPoll(); }
        idleTimeout = setTimeout(switchToSlowPoll, 30 * 60 * 1000);
      }
      boot();
      setTimeout(() => { startFastPoll(); resetIdleTimer(); }, 3000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          clearInterval(fastPoll); fastPoll = null;
          clearInterval(slowPoll); slowPoll = null;
        } else {
          startFastPoll();
          resetIdleTimer();
          setTimeout(doPoll, 500);
        }
      });
      document.addEventListener('click', resetIdleTimer);
      document.addEventListener('keydown', resetIdleTimer);
    </script>
  </body>
