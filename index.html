<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="preconnect" href="https://wc-predictor-backend-production-3bce.up.railway.app" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,700;1,800&family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" sizes="16x16" href="award-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="award-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="award-64.png">
  <link rel="icon" type="image/png" sizes="128x128" href="award-128.png">
  <link rel="icon" type="image/png" sizes="192x192" href="award-256.png">
  <link rel="apple-touch-icon" sizes="180x180" href="award-128.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <title>WC2026 Predictor</title>
  <style>
    :root {
      --paper: #f5f0e8;
      --paper2: #ede8df;
      --paper3: #e4ddd1;
      --ink: #0e0e0e;
      --ink2: #3a3730;
      --ink3: #45403a;
      --ink4: #6e6760;
      --green: #1a5c2a;
      --green-light: #e8f0ea;
      --green-mid: #c2d9c7;
      --red: #c0392b;
      --red-light: #fbecea;
      --gold: #b8860b;
      --gold-light: #fdf6e3;
      --blue: #1a3a6b;
      --blue-light: #e8eef8;
      --purple: #6b3fa0;
      --purple-light: #f0eaf7;
      --rule: rgba(14, 14, 14, 0.12);
      --rule-strong: rgba(14, 14, 14, 0.25);
      --radius: 4px;
    }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Barlow, sans-serif;
      font-weight: 400;
      min-height: 100vh;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }

    header {
      background: var(--ink);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: 60px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .logo {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .logo-main {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: 1.45rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      line-height: 1;
    }

    .logo-main span {
      color: #5ddb7c;
    }

    .logo-sub {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 300;
      font-size: 0.95rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      padding-bottom: 2px;
    }

    .sync-btn {
      background: transparent;
      color: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 7px 16px;
      border-radius: var(--radius);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s;
    }

    .sync-btn:hover {
      border-color: rgba(255, 255, 255, 0.4);
      color: #fff;
    }

    .sync-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .sync-icon {
      font-size: 0.85rem;
      display: inline-block;
    }

    .sync-btn.spinning .sync-icon {
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .tabs-wrapper {
      background: var(--ink);
      display: flex;
      align-items: stretch;
      padding: 0 28px;
      position: relative;
    }

    .tabs-list {
      display: flex;
      flex: 1;
      overflow-x: auto;
      min-width: 0;
    }

    .tabs-list::-webkit-scrollbar {
      display: none;
    }

    .sticky-shell {
      position: sticky;
      top: 0;
      z-index: 200;
      will-change: transform;
      isolation: isolate;
    }

    .tab {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      padding: 13px 20px 11px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      user-select: none;
      white-space: nowrap;
    }

    .tab:hover {
      color: rgba(255, 255, 255, 0.65);
    }

    .tab.active {
      color: #5ddb7c;
      border-bottom-color: #5ddb7c;
    }

    .search-toggle-wrap {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      padding-left: 12px;
    }

    .search-toggle {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.45);
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: var(--radius);
      transition: color 0.18s, background 0.18s;
      -webkit-tap-highlight-color: transparent;
      padding: 0;
    }

    .search-toggle:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }

    .search-toggle.active {
      color: #5ddb7c;
      background: rgba(93, 219, 124, 0.12);
    }

    #clearFilterBtn {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      transform: scale(0.8);
    }

    #clearFilterBtn.visible {
      opacity: 1;
      pointer-events: all;
      transform: scale(1);
    }

    #clearFilterBtn:hover {
      color: #ff6b6b;
      background: rgba(255, 107, 107, 0.12);
    }

    .search-row-wrap {
      max-width: 780px;
      margin: 0 auto;
      padding: 0 24px;
      display: none;
    }

    .search-row-wrap.open {
      display: block;
      animation: searchSlideIn 0.25s ease both;
    }

    @keyframes searchSlideIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .search-row {
      background: #fff;
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      margin-top: 16px;
      overflow: hidden;
    }

    .search-input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
    }

    .search-input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .search-input-icon {
      color: var(--ink4);
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .search-input-row.has-filter .search-input-icon {
      color: var(--green);
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--ink);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      height: 28px;
      width: 100%;
      min-width: 0;
    }

    .search-input::placeholder {
      color: var(--ink4);
      font-family: "Instrument Serif", serif;
      font-style: italic;
      font-weight: 400;
      font-size: 0.95rem;
      letter-spacing: 0;
    }

    .search-chip {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--green-light);
      border: 1px solid var(--green-mid);
      border-radius: var(--radius);
      padding: 4px 6px 4px 8px;
      max-width: 280px;
      margin-right: auto;
    }

    .search-input-row.has-filter .search-chip {
      display: flex;
    }

    .search-input-row.has-filter .search-input-wrap {
      display: none;
    }

    .search-chip-name {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--green);
      white-space: nowrap;
    }

    .search-chip-vs {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 0.7rem;
      color: var(--green);
      opacity: 0.65;
      font-weight: 600;
    }

    .search-chip-clear {
      background: rgba(26, 92, 42, 0.15);
      border: none;
      color: var(--green);
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      padding: 0;
      flex-shrink: 0;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .search-chip-clear:hover {
      background: rgba(26, 92, 42, 0.3);
    }

    .search-close {
      background: transparent;
      border: none;
      color: var(--ink4);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 0;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .search-close:hover {
      background: var(--paper);
      color: var(--ink);
    }

    .search-results {
      border-top: 1px solid var(--rule);
      max-height: 60vh;
      overflow-y: auto;
      padding: 6px 0;
    }

    .search-results.empty {
      display: none;
    }

    .search-section-title {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink4);
      padding: 8px 14px 4px;
    }

    .search-result {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.12s;
      -webkit-tap-highlight-color: transparent;
    }

    .search-result:hover {
      background: var(--paper);
    }

    .search-result-team-name {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--ink);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-result-meta {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--ink4);
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }

    .search-match-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.12s;
      -webkit-tap-highlight-color: transparent;
    }

    .search-match-row:hover {
      background: var(--paper);
    }

    .search-match-teams {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .search-match-team {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .search-match-team-name {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-match-vs {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 0.72rem;
      color: var(--ink4);
      font-weight: 600;
      flex-shrink: 0;
    }

    .search-match-meta {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--ink4);
      letter-spacing: 0.04em;
      flex-shrink: 0;
      text-align: right;
      white-space: nowrap;
    }

    main {
      max-width: 780px;
      margin: 0 auto;
      padding: 36px 24px 100px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* ----------------------------------------------------
      Tournament Progress
    ---------------------------------------------------- */

    .tournament-progress{
      background:#fff;
      border-bottom:1px solid var(--rule);
      padding:14px 28px 13px;
    }

    .tp-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
    }

    .tp-heading{
      display:flex;
      align-items:center;
      gap:10px;

      font-family:"Barlow Condensed",sans-serif;
      font-weight:800;
      font-size:.82rem;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--ink3);
    }

    .tp-dot{
      width:7px;
      height:7px;
      border-radius:50%;
      background:#5ddb7c;
      flex-shrink:0;
    }

    .tp-stage{
      font-family:"Barlow Condensed",sans-serif;
      font-weight:700;
      font-size:.8rem;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--ink4);
      white-space:nowrap;
    }

    .tp-progress-wrap{
      margin:12px 0 10px;
    }

    .tp-progress-track{
      height:5px;
      width:100%;
      background:var(--paper3);
      overflow:hidden;
    }

    .tp-progress-fill{
      width:0%;
      height:100%;
      background:#5ddb7c;
      transition:width .7s cubic-bezier(.22,.61,.36,1);
    }

    .tp-footer{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;

      font-family:"Barlow Condensed",sans-serif;
      font-size:.76rem;
      font-weight:600;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--ink4);
    }

    .tp-live-active{
      color:var(--green);
    }

    @media (max-width:700px){

      .tournament-progress{
        padding:10px 16px;
      }

      .tp-row{
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:12px;
      }

      .tp-heading{
        font-size:.72rem;
        letter-spacing:.14em;
      }

      .tp-stage{
        font-size:.68rem;
        letter-spacing:.10em;
        text-align:right;
      }

      .tp-progress-wrap{
        margin:9px 0;
      }

      .tp-progress-track{
        height:4px;
      }

      .tp-footer{
        display:block;
        font-size:.68rem;
        letter-spacing:.08em;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
      }

      .tp-footer span + span::before{
        content:" • ";
        color:var(--rule-strong);
      }

      .tp-footer span{
        display:inline;
      }

    }

    /* ---- New: Hide-past toggle bar ---- */
    .past-toggle-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 24px;
      background: var(--paper2);
      border-bottom: 1px solid var(--rule);
    }

    .past-toggle-bar.hidden-control {
      display: none !important;
    }

    .past-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .past-toggle input {
      width: 16px;
      height: 16px;
      accent-color: var(--green);
      cursor: pointer;
    }

    .past-toggle-label {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ink2);
    }

    .past-toggle-count {
      font-family: Barlow, sans-serif;
      font-size: 0.78rem;
      color: var(--ink4);
      font-weight: 500;
      white-space: nowrap;
    }

    .stage-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 40px 0 16px;
    }

    .stage-header:first-child {
      margin-top: 0;
    }

    .stage-label {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 800;
      font-size: 0.88rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink3);
      white-space: nowrap;
    }

    .stage-rule {
      flex: 1;
      height: 1px;
      background: var(--rule);
    }

    .match-card {
      background: #fff;
      border: 1.5px solid var(--rule);
      border-radius: var(--radius);
      margin-bottom: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.18s, box-shadow 0.18s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    @media(hover:hover) {
      .match-card:hover {
        border-color: #5ddb7c;
        box-shadow: 0 0 0 3px rgba(93, 219, 124, 0.13), 0 4px 20px rgba(0, 0, 0, 0.06);
      }
    }

    .match-card.open {
      border-color: #5ddb7c;
      box-shadow: 0 0 0 3px rgba(93, 219, 124, 0.13), 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    .match-row {
      display: grid;
      grid-template-columns: 1fr 130px 1fr;
      align-items: stretch;
      min-height: 72px;
    }

    .team-cell {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      min-width: 0;
      overflow: hidden;
    }

    .team-cell.home {
      justify-content: center;
      border-right: 1px solid var(--rule);
    }

    .team-cell.away {
      justify-content: center;
      border-left: 1px solid var(--rule);
    }

    .team-name {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      line-height: 1.1;
      color: var(--ink);
      text-align: center;
    }

    .centre-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 8px;
      gap: 5px;
      background: var(--paper);
      transition: background 0.18s;
    }

    .match-card.open .centre-block {
      background: var(--green-light);
    }

    .score-display {
      display: flex;
      align-items: center;
      gap: 2px;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: 2rem;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .score-num {
      color: var(--ink);
      min-width: 26px;
      text-align: center;
    }

    .score-num.final {
      color: var(--green);
    }

    .score-num.pending {
      color: var(--ink3);
      font-size: 1.4rem;
      font-weight: 400;
    }

    .score-dash {
      color: var(--ink3);
      font-weight: 400;
      font-size: 1.6rem;
      padding: 0 2px;
    }

    .match-status {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .badge {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 2px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      white-space: nowrap;
    }

    .badge.upcoming {
      background: var(--paper3);
      color: var(--ink2);
    }

    .badge.finished {
      background: var(--green-light);
      color: var(--green);
    }

    .badge.live {
      background: var(--red-light);
      color: var(--red);
      animation: blink 1.4s infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }

    .match-time {
      font-family: Barlow, sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--ink3);
      letter-spacing: 0.03em;
    }

    .predictions-panel {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.22s ease;
      background: var(--paper);
      overflow: hidden;
    }

    .predictions-panel-inner {
      overflow: hidden;
      padding: 0 20px;
      transition: padding 0.22s ease;
    }

    .match-card.open .predictions-panel {
      grid-template-rows: 1fr;
      border-top: 1px solid var(--rule);
    }

    .match-card.open .predictions-panel-inner {
      padding: 14px 20px;
    }

    .pred-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      justify-items: stretch;
    }

    .pred-item {
      background: #fff;
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.15s;
      position: relative;
    }

    .pred-item:hover {

      transform: translate(-50%, -50%) scale(1);
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--rule);
    }

    .calendar-title {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .calendar-close {
      background: transparent;
      border: none;
      color: var(--ink4);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 24px;
      line-height: 1;
      padding: 0;
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .calendar-close:hover {
      background: var(--paper);
      color: var(--ink);
    }

    .calendar-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--rule);
    }

    .calendar-nav-btn {
      background: transparent;
      border: 1px solid var(--rule-strong);
      color: var(--ink);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 0;
      transition: background 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .calendar-nav-btn:hover {
      background: var(--paper);
      border-color: var(--ink3);
    }

    .calendar-nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .calendar-month-year {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .calendar-body {
      padding: 16px 20px 20px;
      overflow-y: auto;
    }

    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 8px;
    }

    .calendar-weekday {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink4);
      text-align: center;
      padding: 8px 4px;
    }

    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      border: 1.5px solid transparent;
      background: transparent;
      padding: 4px;
    }

    .calendar-day:hover:not(.disabled):not(.empty) {
      background: var(--paper);
      border-color: var(--rule-strong);
    }

    .calendar-day.disabled {
      opacity: 0.25;
      cursor: not-allowed;
      color: var(--ink4);
    }

    .calendar-day.empty {
      cursor: default;
    }

    .calendar-day.selected {
      background: var(--green);
      border-color: var(--green);
    }

    .calendar-day.selected:hover {
      background: #156b24;
      border-color: #156b24;
    }

    .calendar-day.today:not(.selected) {
      border-color: var(--green);
    }

    .calendar-day-num {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--ink);
      line-height: 1;
    }

    .calendar-day.selected .calendar-day-num {
      color: #fff;
    }

    .calendar-day-count {
      font-family: "Barlow", sans-serif;
      font-weight: 600;
      font-size: 0.65rem;
      color: var(--green);
      margin-top: 2px;
      line-height: 1;
    }

    .calendar-day.selected .calendar-day-count {
      color: rgba(255, 255, 255, 0.85);
    }

    .calendar-day.disabled .calendar-day-count {
      display: none;
    }

    .calendar-filter-section {
      padding: 16px 20px;
      border-bottom: 1px solid var(--rule);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .calendar-filter-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .calendar-filter-toggle input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--green);
    }

    .calendar-filter-label {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.03em;
      color: var(--ink);
      user-select: none;
    }

    .calendar-user-selector {
      display: none;
      animation: slideDown 0.2s ease;
    }

    .calendar-user-selector.visible {
      display: block;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .custom-select {
      position: relative;
      width: 100%;
    }

    .custom-select-trigger {
      width: 100%;
      padding: 12px 40px 12px 14px;
      border: 1.5px solid var(--rule-strong);
      border-radius: 8px;
      background: #fff;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.02em;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .custom-select-trigger:hover {
      border-color: var(--ink3);
      background: var(--paper);
    }

    .custom-select.open .custom-select-trigger {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(26, 92, 42, 0.1);
    }

    .custom-select-trigger.placeholder {
      color: var(--ink4);
    }

    .custom-select-arrow {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      transition: transform 0.2s;
    }

    .custom-select.open .custom-select-arrow {
      transform: translateY(-50%) rotate(180deg);
    }

    .custom-select-arrow svg {
      display: block;
      width: 16px;
      height: 16px;
      stroke: var(--ink3);
      stroke-width: 2.5;
    }

    .custom-select-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: #fff;
      border: 1.5px solid var(--rule-strong);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      max-height: 240px;
      overflow-y: auto;
      z-index: 1000;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }

    .custom-select.open .custom-select-dropdown {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    .custom-select-option {
      padding: 12px 14px;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.02em;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .custom-select-option:hover {
      background: var(--green-light);
    }

    .custom-select-option.selected {
      background: var(--green-light);
      color: var(--green);
      font-weight: 700;
    }

    .custom-select-option:first-child {
      border-radius: 6px 6px 0 0;
    }

    .custom-select-option:last-child {
      border-radius: 0 0 6px 6px;
    }

    .custom-select-option:only-child {
      border-radius: 6px;
    }

    .calendar-day-count.unpredicted {
      color: #ff6b6b;
    }

    .calendar-day.selected .calendar-day-count.unpredicted {
      color: rgba(255, 255, 255, 0.9);
    }

    @keyframes blink-dot {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.2;
      }
    }

    .hidden-control {
      display: none !important;
    }

    @media(max-width: 560px) {
      .header-top {
        padding: 0 16px;
        height: 54px;
      }

      .logo-main {
        font-size: 1.2rem;
      }

      .logo-sub {
        font-size: 0.85rem;
      }

      .tabs-wrapper {
        padding: 0 16px;
      }

      .tab {
        padding: 11px 14px 9px;
        font-size: 0.88rem;
      }

      .search-toggle-wrap {
        padding-left: 8px;
      }

      .search-row-wrap {
        padding: 0 14px;
      }

      .search-input {
        font-size: 0.95rem;
      }

      .search-input::placeholder {
        font-size: 0.9rem;
      }

      .search-chip {
        max-width: 220px;
      }

      .past-toggle-bar {
        padding: 7px 14px;
      }

      main {
        padding: 24px 14px 100px;
      }

      .team-name {
        font-size: 0.9rem;
        max-width: 100%;
      }

      .team-cell {
        padding: 12px 12px;
      }

      .match-row {
        grid-template-columns: 1fr 106px 1fr;
      }

      .centre-block {
        min-width: 0;
        padding: 10px 6px;
      }

      .score-display {
        font-size: 1.6rem;
      }

      .lb-header-row,
      .lb-row {
        grid-template-columns: 30px 44px 1fr 64px 44px 48px;
        padding: 12px 14px;
      }

      .lb-pts {
        font-size: 1.2rem;
      }

      .lb-name {
        font-size: 0.9rem;
      }

      .sk-lb-row {
        grid-template-columns: 30px 44px 1fr 64px 44px 48px;
        padding: 12px 14px;
      }

      .pred-grid {
        grid-template-columns: 1fr 1fr;
      }

      .pred-item {
        padding: 10px 10px;
      }

      .pred-input {
        width: 36px;
        height: 36px;
      }

      .score-chip {
        width: 36px;
        height: 36px;
      }

      .stats-kpi-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .kpi-value {
        font-size: 1.6rem;
      }

      .hbar-row {
        grid-template-columns: 70px 1fr 42px;
        gap: 8px;
      }

      .hbar-name {
        font-size: 0.78rem;
      }

      .stacked-row {
        grid-template-columns: 70px 1fr 50px;
        gap: 8px;
      }

      .donut-wrap {
        gap: 16px;
      }

      .donut-svg {
        width: 130px;
        height: 130px;
      }

      .scoreline-row {
        grid-template-columns: repeat(auto-fit, minmax(42px, 1fr));
      }

      .scoreline-label {
        font-size: 0.85rem;
      }

      .scoreline-count {
        font-size: 0.65rem;
      }

      .search-match-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }

      .search-match-teams {
        width: 100%;
      }

      .search-match-team-name {
        font-size: 0.85rem;
      }

      .search-match-meta {
        font-size: 0.7rem;
        text-align: left;
        padding-left: 24px;
      }
    }

    .pos-badge {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      border-radius: 3px;
      padding: 2px 5px;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: .03em;
      line-height: 1;
      white-space: nowrap;
    }

    .pos-badge.up {
      background: var(--green-light);
      color: var(--green);
    }

    .pos-badge.down {
      background: var(--red-light);
      color: var(--red);
    }

    .pos-badge.same {
      background: transparent;
      color: var(--ink4);
      font-size: 0.85rem;
      line-height: 1;
    }

    .confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      transition: opacity 0.2s ease;
    }

    .confirm-overlay.open {
      opacity: 1;
      pointer-events: all;
      visibility: visible;
    }

    .confirm-box {
      background: #fff;
      border-radius: 12px;
      max-width: 380px;
      width: 100%;
      padding: 24px 24px 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      transform: scale(0.95);
      transition: transform 0.2s ease;
    }

    .confirm-overlay.open .confirm-box {
      transform: scale(1);
    }

    .confirm-title {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 10px;
    }

    .confirm-msg {
      font-family: Barlow, sans-serif;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--ink2);
      margin-bottom: 22px;
    }

    .confirm-msg strong {
      color: var(--red);
      font-weight: 700;
    }

    .confirm-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .confirm-btn {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .confirm-btn.cancel {
      background: var(--paper2);
      color: var(--ink2);
      border-color: var(--rule-strong);
    }

    .confirm-btn.cancel:hover {
      background: var(--paper3);
    }

    .confirm-btn.ok {
      background: var(--green);
      color: #fff;
    }

    .confirm-btn.ok:hover {
      background: #156b24;
    }

    .confirm-btn.ok.danger {
      background: var(--red);
    }

    .confirm-btn.ok.danger:hover {
      background: #a03228;
    }

    .toast.with-undo {
      display: flex;
      align-items: center;
      gap: 14px;
      white-space: normal;
    }

    .undo-toast-msg {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .undo-toast-btn {
      background: transparent;
      border: 1px solid #5ddb7c;
      color: #5ddb7c;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 800;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .undo-toast-btn:hover {
      background: #5ddb7c;
      color: var(--ink);
    }
  </style>
</head>

<body>
  <div class="sticky-shell">
    <header>
      <div class="header-top">
        <div class="logo">
          <div class="logo-main">WC<span>2026</span></div>
          <div class="logo-sub">Predictor</div>
        </div>
        <button class="sync-btn" id="syncBtn" onclick="syncAll()">
          <span class="sync-icon">&#x21BB;</span>
          <span class="btn-label">Refresh Results</span>
        </button>
      </div>
      <div class="tabs-wrapper">
        <div class="tabs-list">
          <div class="tab active" data-tab="predict" onclick="switchTab('predict',this)">Predict</div>
          <div class="tab" data-tab="leaderboard" onclick="switchTab('leaderboard',this)">Leaderboard</div>
          <div class="tab" data-tab="stats" onclick="switchTab('stats',this)">Stats</div>
        </div>
        <div class="search-toggle-wrap">
          <button class="search-toggle" id="clearFilterBtn" onclick="clearAllFilters()" aria-label="Clear filters"
            title="Clear all filters">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
              <line x1="2" y1="2" x2="22" y2="22"></line>
            </svg>
          </button>
          <button class="search-toggle" id="calendarToggle" onclick="toggleCalendar()" aria-label="Calendar">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </button>
          <button class="search-toggle" id="searchToggle" onclick="toggleSearchRow()" aria-label="Search">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </button>
        </div>
      </div>

      <div class="tournament-progress" id="tournamentProgress">
        <div class="tp-row">
          <div class="tp-heading">
            <span class="tp-dot"></span>
            FIFA WORLD CUP 2026
          </div>

          <div class="tp-stage" id="tpStage">
            LOADING...
          </div>
        </div>

        <div class="tp-progress-wrap">
          <div class="tp-progress-track">
            <div class="tp-progress-fill" id="tpFill"></div>
          </div>
        </div>

        <div class="tp-footer">
          <span id="tpSummary">
            0 / 0 MATCHES COMPLETE
          </span>

          <span id="tpLiveSummary">
            0 LIVE • 0 TO PLAY
          </span>
        </div>
      </div>

      <!-- New: Hide-past toggle bar -->
      <div class="past-toggle-bar" id="pastToggleBar">
        <label class="past-toggle">
          <input type="checkbox" id="hidePastToggle" checked onchange="onHidePastToggle()">
          <span class="past-toggle-label">Hide past matches</span>
        </label>
        <span class="past-toggle-count" id="pastToggleCount"></span>
      </div>
    </header>
    <div class="search-row-wrap" id="searchRowWrap">
      <div class="search-row">
        <div class="search-input-row" id="searchInputRow">
          <span class="search-input-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </span>
          <div class="search-input-wrap">
            <input type="text" id="searchInput" class="search-input" placeholder="e.g. Brazil, Argentina…"
              autocomplete="off" spellcheck="false">
          </div>
          <div class="search-chip" id="searchChip"></div>
          <button class="search-close" onclick="closeSearchRow()" aria-label="Close search">×</button>
        </div>
        <div class="search-results empty" id="searchResults"></div>
      </div>
    </div>
  </div>
  <main>
    <div id="predict" class="tab-content active">
      <div id="matchList">
        <div class="state-msg">Loading matches…</div>
      </div>
    </div>
    <div id="leaderboard" class="tab-content">
      <div id="lbList">
        <div class="state-msg">Loading leaderboard…</div>
      </div>
    </div>
    <div id="stats" class="tab-content">
      <div id="statsContent">
        <div class="state-msg">Loading stats…</div>
      </div>
    </div>
  </main>
  <div class="toast" id="toast"></div>
  <!-- Confirmation dialog -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box" id="confirmBox">
      <div class="confirm-title" id="confirmTitle">Are you sure?</div>
      <div class="confirm-msg" id="confirmMsg"></div>
      <div class="confirm-actions">
        <button class="confirm-btn cancel" id="confirmCancel">Cancel</button>
        <button class="confirm-btn ok" id="confirmOk">Confirm</button>
      </div>
    </div>
  </div>
  <div class="calendar-modal-overlay" id="calendarOverlay" onclick="closeCalendar()"></div>
  <div class="calendar-modal" id="calendarModal">
    <div class="calendar-header">
      <div class="calendar-title">Match Calendar</div>
      <button class="calendar-close" onclick="closeCalendar()" aria-label="Close">×</button>
    </div>
    <div class="calendar-nav">
      <button class="calendar-nav-btn" id="calPrevBtn" onclick="changeCalendarMonth(-1)"
        aria-label="Previous month">‹</button>
      <div class="calendar-month-year" id="calMonthYear"></div>
      <button class="calendar-nav-btn" id="calNextBtn" onclick="changeCalendarMonth(1)"
        aria-label="Next month">›</button>
    </div>
    <div class="calendar-filter-section">
      <label class="calendar-filter-toggle">
        <input type="checkbox" id="unpredictedToggle" onchange="toggleUnpredictedMode()">
        <span class="calendar-filter-label">My Pending Picks</span>
      </label>
      <div class="calendar-user-selector" id="userSelectorWrap">
        <div class="custom-select" id="customUserSelect">
          <div class="custom-select-trigger placeholder" id="userSelectTrigger" onclick="toggleUserDropdown()">
            <span id="userSelectText">Select your name...</span>
            <div class="custom-select-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          </div>
          <div class="custom-select-dropdown" id="userSelectDropdown"></div>
        </div>
      </div>
    </div>
    <div class="calendar-body">
      <div class="calendar-weekdays">
        <div class="calendar-weekday">Sun</div>
        <div class="calendar-weekday">Mon</div>
        <div class="calendar-weekday">Tue</div>
        <div class="calendar-weekday">Wed</div>

    const NULL_SENTINEL = -1;

        const titleEl = document.getElementById('confirmTitle');
        const msgEl = document.getElementById('confirmMsg');
        const okBtn = document.getElementById('confirmOk');
        const cancelBtn = document.getElementById('confirmCancel');
        if (!overlay) { resolve(true); return; }
        titleEl.textContent = title;
        msgEl.innerHTML = messageHtml;
        okBtn.classList.toggle('danger', !!danger);
        okBtn.textContent = danger ? 'Yes, do it' : 'Confirm';
        overlay.classList.add('open');
        _confirmResolve = resolve;
        function cleanup(result) {
          overlay.classList.remove('open');
          okBtn.onclick = null;
          cancelBtn.onclick = null;
          overlay.onclick = null;
          _confirmResolve = null;
          resolve(result);
        }
        okBtn.onclick = () => cleanup(true);
        cancelBtn.onclick = () => cleanup(false);
        overlay.onclick = (e) => { if (e.target === overlay) cleanup(false); };
      });

        m.score_home != null &&
        m.score_away != null

      const live = matches.filter(isMatchLive).length;

      const remaining = total - finished - live;

      const percent = total ? finished / total * 100 : 0;

      document.getElementById("tpFill").style.width = percent + "%";

      document.getElementById("tpSummary").textContent =
        `${finished} / ${total} MATCHES COMPLETE`;

      const liveSummary = document.getElementById("tpLiveSummary");

      liveSummary.textContent =
        `${live} LIVE • ${remaining} TO PLAY`;

      liveSummary.classList.toggle("tp-live-active", live > 0);

        stage.textContent = "TOURNAMENT COMPLETE";

        stage.textContent =

    function hashStr(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }
    function seededShuffle(arr, seed) {
      const a = arr.slice();
      let s = seed >>> 0;
      for (let i = a.length - 1; i > 0; i--) {
        s ^= s << 13; s >>>= 0;
        s ^= s >>> 17; s >>>= 0;
        s ^= s << 5; s >>>= 0;
        const j = s % (i + 1);
        const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
      }
      return a;
    }

    function computeCountdownHTML(kickoffStr, status) {
      if (status === 'FINISHED') return '';
      const kickoff = parseUTC(kickoffStr);
      if (!kickoff) return '';
      const diff = kickoff.getTime() - new Date().getTime();
      if (diff <= 0) {
        if (!status) return '';
        const humanStatuses = ['LIVE', 'HT', 'ET', 'PEN', 'AET'];
        if (!humanStatuses.includes(status.toUpperCase())) return '';
        return `<span class="match-time">${status}</span>`;
      }
      const totalSec = Math.floor(diff / 1000);
      const d = Math.floor(totalSec / 86400);
      const h = Math.floor((totalSec % 86400) / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      let label, dotColor;
      if (diff >= 86400000) {
        label = d + 'd ' + h + 'h';
        dotColor = '#6e6760';
      } else if (diff >= 3600000) {
        label = h + 'h ' + m + 'm';
        dotColor = '#b8860b';
      } else if (diff >= 60000) {
        label = m + 'm ' + s + 's';
        dotColor = '#c0392b';
      } else {
        label = s + 's';
        dotColor = '#c0392b';
      }

    function searchTeams(query) {

    function renderSearchResults(query) {
      const results = document.getElementById('searchResults');

        results.innerHTML = '';

        const topKey = allSorted[0];
        const topVal = dataMap[topKey];
        const cells = sorted.map((k, idx) => {
          const v = dataMap[k];
          const isTop = idx === 0;
          const rgb = colorForRank(idx, sorted.length, baseRGB);
          const bg = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
          const lum = (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]);
          const fg = lum < 150 ? '#ffffff' : '#1a1a1a';
          const display = k.replace('-', '–');
          return `<div class="scoreline-cell ${isTop ? 'top' : ''}" style="background:${bg};color:${fg}" title="${display}: ${v} time${v !== 1 ? 's' : ''}">
          <div class="scoreline-label">${display}</div>
          <div class="scoreline-count">${Math.round((v / grandTotal) * 100)}%</div>
        </div>`;
        }).join('');
        return `<div class="scoreline-block">
        <div class="scoreline-block-title ${klass}">${label}</div>
        <div class="scoreline-row">${cells}</div>
        <div class="scoreline-summary">Most common: <strong>${topKey.replace('-', '–')}</strong> · ${topVal}/${grandTotal}</div>
      </div>`;
      }
      const predBlock = buildBlock('What players are picking  (Top 5)', 'predicted', s.predictedScorelineMap, [26, 58, 107]);
      const actualBlock = buildBlock('What actually happened  (Top 5)', 'actual', s.actualScorelineMap, [26, 92, 42]);
      const predKeys = Object.keys(s.predictedScorelineMap);
      const actualKeys = Object.keys(s.actualScorelineMap);
      let predTop = null, actualTop = null;
      if (predKeys.length) predTop = predKeys.reduce((a, b) => s.predictedScorelineMap[a] >= s.predictedScorelineMap[b] ? a : b);
      if (actualKeys.length) actualTop = actualKeys.reduce((a, b) => s.actualScorelineMap[a] >= s.actualScorelineMap[b] ? a : b);
      let insight = '';
      if (predTop && actualTop) {
        if (predTop === actualTop) insight = `Wisdom of the crowd! Most-picked and most-occurring scoreline are both <strong>${predTop.replace('-', '–')}</strong>.`;
        else insight = `Most picked: <strong>${predTop.replace('-', '–')}</strong> · Most actual: <strong>${actualTop.replace('-', '–')}</strong>`;
      } else if (predTop) {
        insight = `Most-picked scoreline so far: <strong>${predTop.replace('-', '–')}</strong> · No finished matches yet.`;
      } else {
        insight = 'No predictions or results yet.';
      }
      return `<div class="stats-card${statsFirstRender ? ' animate-in' : ''}">
      <div class="stats-card-header">
        <div class="stats-card-title">Predicted vs Actual Scorelines</div>
        <div class="stats-card-sub">${insight}</div>
      </div>
      <div class="stats-card-body">
        <div class="scoreline-heatmap-wrap">${predBlock}${actualBlock}</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;color:var(--ink4);text-align:center;margin-top:12px;letter-spacing:0.05em;">
          Top 5 shown · percentages out of all submitted predictions · gold outline marks the top scoreline
        </div>
      </div>
    </div>`;
    }
    function renderGoalsComparison(s) {
      const players = Object.values(s.playerStats)
        .filter(p => p.predictions > 0)
        .sort((a, b) => (b.predGoalsTotal / Math.max(b.predictions, 1)) - (a.predGoalsTotal / Math.max(a.predictions, 1)));
      if (!players.length) return '';
      const max = Math.max(...players.map(p => p.predGoalsTotal / p.predictions), 1);
      const rows = players.map(p => {
        const avg = (p.predGoalsTotal / p.predictions);
        const pct = (avg / max) * 100;
        return `<div class="hbar-row">
        <div class="hbar-name">${escHtml(p.name)}</div>
        <div class="hbar-track"><div class="hbar-fill purple" style="width:${pct}%"></div></div>
        <div class="hbar-val">${avg.toFixed(2)}</div>
      </div>`;
      }).join('');
      const actualAvg = s.finishedMatches ? ((s.totalActualHomeGoals + s.totalActualAwayGoals) / s.finishedMatches).toFixed(2) : 'N/A';
      return `<div class="stats-card${statsFirstRender ? ' animate-in' : ''}">
      <div class="stats-card-header">
        <div class="stats-card-title">Goal Optimism</div>
        <div class="stats-card-sub">Avg goals predicted per match · actual avg so far: <strong>${actualAvg}</strong></div>
      </div>
      <div class="stats-card-body">${rows}</div>
    </div>`;
    }
    function renderStats() {
      const container = document.getElementById('statsContent');
      if (!container) return;
      if (!users.length) {
        const emptyHtml = '<div class="state-msg">No data yet. Add players first.</div>';
        if (container.innerHTML !== emptyHtml) container.innerHTML = emptyHtml;
        return;
      }
      if (!lastLBData) {
        fetch(API + '/leaderboard')
          .then(res => res.json())
          .then(data => {
            if (!Array.isArray(data)) return;
            lastLBData = data;
            lastStatsHtml = '';
            renderStats();
          })
          .catch(() => { });
      }
      const s = computeStats();
      let html = '';
      html += renderKPIs(s);
      html += renderHorizontalBars(s);
      html += renderHitRateDonut(s);
      html += renderStackedBars(s);
      html += renderPredictionsBars(s);
      html += renderGoalsComparison(s);
      html += renderScorelineHeatmap(s);
      if (html === lastStatsHtml) return;
      const scrollY = window.scrollY;
      container.innerHTML = html;
      lastStatsHtml = html;
      statsFirstRender = false;
      window.scrollTo(0, scrollY);
      statsInitialized = true;
    }
    function applyLocalPred(matchId, userId, ph, pa) {
      const m = matches.find(x => String(x.match_id) === String(matchId));
      if (!m) return;
      if (!m.predictions) m.predictions = {};
      if (ph === null && pa === null) {
        delete m.predictions[userId];
      } else {
        if (!m.predictions[userId]) m.predictions[userId] = {};
        m.predictions[userId].pred_home = ph;
        m.predictions[userId].pred_away = pa;
      }
      const sentenceEl = document.querySelector(`.pred-sentence[data-matchid="${matchId}"] .pred-sentence-txt`);
      if (sentenceEl) sentenceEl.innerHTML = buildPredSentence(m, users);
      const card = document.querySelector(`.match-card[data-matchid="${matchId}"]`);
      if (card) {
        const predItem = card.querySelector(`.pred-item[data-userid="${userId}"]`);
        if (predItem) {
          const clearBtn = predItem.querySelector('[data-role="clear"]');
          const meta = getMatchMeta(m);
          if (clearBtn) {
            const cleared = ph === null && pa === null;
            const showClear = !cleared && !meta.locked;
            clearBtn.classList.toggle('hidden', !showClear);
          }
        }
      }
      lastMatchesJson = JSON.stringify(matches);
      lastStatsHtml = '';
      lastLeaderboardHtml = '';
    }
    function clearPred(matchId, userId) {
      const name = getUserDisplayName(userId);
      showConfirm(
        'Clear prediction?',
        `You are about to <strong>clear ${escHtml(name)}'s</strong> prediction.<br><br>No editing your friends' picks — we're watching. Sure this one's yours?`,
        true
      ).then(confirmed => {
        if (!confirmed) return;
        doClearPred(matchId, userId);
      });
    }
    function doClearPred(matchId, userId) {
      const card = document.querySelector(`.match-card[data-matchid="${matchId}"]`);
      if (!card) return;
      const predItem = card.querySelector(`.pred-item[data-userid="${userId}"]`);
      if (!predItem) return;
      const inHome = predItem.querySelector('[data-role="input-home"]');
      const inAway = predItem.querySelector('[data-role="input-away"]');
      if (inHome) inHome.value = '';
      if (inAway) inAway.value = '';
      const key = matchId + userId;
      if (timers[key]) {
        clearTimeout(timers[key]);
        delete timers[key];
      }
      delete predBuffer[key];
      applyLocalPred(matchId, userId, null, null);
      showToast('Clearing…');
      fetch(API + '/predictions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: userId,
          match_id: parseInt(matchId, 10),
          pred_home: NULL_SENTINEL,
          pred_away: NULL_SENTINEL
        })
      }).then(r => r.json()).then(d => {
        if (d.status === 'saved') {
          showToast('Cleared ✓');
          setTimeout(doPoll, 200);
        } else {
          showToast(d.error || 'Error clearing', true);
        }
      }).catch(() => showToast('Network error', true));
    }
    function savePred(input) {
      const parentCard = input.closest('.match-card');
      if (parentCard) parentCard.dataset.suppressToggle = '1';
      const _savedScroll = window.scrollY;
      const matchId = input.dataset.matchid;
      const userId = input.dataset.userid;
      const side = input.dataset.side;
      const val = input.value.trim();
      if (!matchId || !userId || !side) return;
      const key = matchId + userId;
      const inputs = input.closest('.pred-item').querySelectorAll('.pred-input');
      const hVal = inputs[0].value.trim();
      const aVal = inputs[1].value.trim();
      if (hVal === '' && aVal === '') {
        if (timers[key]) {
          clearTimeout(timers[key]);
          delete timers[key];
        }
        delete predBuffer[key];
        const m = matches.find(x => String(x.match_id) === String(matchId));
        const prevPred = m && m.predictions ? m.predictions[userId] : null;
        if (!isCleared(prevPred)) clearPred(matchId, userId);
        return;
      }
      if (hVal === '' || aVal === '') return;
      const m = matches.find(x => String(x.match_id) === String(matchId));
      const prevPred = m && m.predictions ? m.predictions[userId] : null;
      const prevSnapshot = isCleared(prevPred)
        ? null
        : { home: Number(prevPred.pred_home), away: Number(prevPred.pred_away) };
      predBuffer[key] = {
        home: parseInt(hVal, 10),
        away: parseInt(aVal, 10)
      };
      if (timers[key]) clearTimeout(timers[key]);
      timers[key] = setTimeout(function () {
        const buf = predBuffer[key];
        if (!buf || buf.home === null || buf.away === null || isNaN(buf.home) || isNaN(buf.away)) return;
        // NOTE: no "Saving…" toast here — only one final toast is shown (fixes double pop-up)
        fetch(API + '/predictions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: userId,
            match_id: parseInt(matchId, 10),
            pred_home: buf.home,
            pred_away: buf.away
          })
        }).then(r => r.json()).then(d => {
          if (d.status === 'saved') {
            applyLocalPred(matchId, userId, buf.home, buf.away);
            requestAnimationFrame(() => window.scrollTo(0, _savedScroll));
            const name = getUserDisplayName(userId);
            showUndoToast(
              `Saved ${buf.home}–${buf.away} for ${name}`,
              matchId, userId, prevSnapshot
            );
            setTimeout(doPoll, 200);
          } else {
            showToast(d.error || 'Error saving', true);
          }
        }).catch(() => showToast('Network error', true));
      }, 500);
    }
    async function syncAll() {
      const btn = document.getElementById('syncBtn');
      const lbl = btn.querySelector('.btn-label');
      btn.disabled = true;
      btn.classList.add('spinning');
      if (lbl) lbl.textContent = 'Refreshing…';
      try {
        const data = await fetch(API + '/sync', { method: 'POST' }).then(r => r.json());
        showToast('Synced ' + data.count + ' match' + (data.count !== 1 ? 'es' : ''));
        const [mu, mm] = await Promise.all([
          fetch(API + '/users').then(r => r.json()),
          fetch(API + '/matches').then(r => r.json())
        ]);
        const oldMatches = matches;
        users = mu;
        matches = mm;
        updateTournamentProgress();
        sortUsers();
        lastUsersJson = JSON.stringify(users);
        lastMatchesJson = JSON.stringify(matches);
        lastStatsHtml = '';
        lastLeaderboardHtml = '';
        patchMatchDOM(oldMatches, mm, mu);
        if (document.getElementById('leaderboard').classList.contains('active')) {
          lbInitialized = false;
          renderLeaderboard();
        }
        if (document.getElementById('stats').classList.contains('active')) renderStats();
      } catch (e) {
        console.error('[WC2026] sync failed:', e);
        showToast('Sync failed', true);
      } finally {
        btn.disabled = false;
        btn.classList.remove('spinning');
        if (lbl) lbl.textContent = 'Refresh Results';
      }
    }
    let undoToastTimer;
    function showToast(msg, isError) {
      const t = document.getElementById('toast');
      // Ensure any pending undo-toast hide/layout is cleared so toasts don't appear back-to-back
      clearTimeout(undoToastTimer);
      t.classList.remove('with-undo');
      t.textContent = msg;
      t.className = 'toast' + (isError ? ' error' : '') + ' show';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
    }
    function showUndoToast(msg, matchId, userId, prevSnapshot) {
      const t = document.getElementById('toast');
      if (!t) return;
      clearTimeout(toastTimer);
      clearTimeout(undoToastTimer);
      t.innerHTML = `<span class="undo-toast-msg">${escHtml(msg)}</span><button class="undo-toast-btn" id="undoToastBtn">Undo</button>`;
      t.className = 'toast show with-undo';
      const btn = document.getElementById('undoToastBtn');
      if (btn) {
        btn.onclick = function (e) {
          e.stopPropagation();
          undoPrediction(matchId, userId, prevSnapshot);
        };
      }
      undoToastTimer = setTimeout(() => {
        t.classList.remove('show');
        t.classList.remove('with-undo');
      }, 6000);
    }
    function undoPrediction(matchId, userId, prevSnapshot) {
      const card = document.querySelector(`.match-card[data-matchid="${matchId}"]`);
      const predItem = card ? card.querySelector(`.pred-item[data-userid="${userId}"]`) : null;
      const inputs = predItem ? predItem.querySelectorAll('.pred-input') : null;
      const key = matchId + userId;
      if (timers[key]) { clearTimeout(timers[key]); delete timers[key]; }
      delete predBuffer[key];
      if (!prevSnapshot) {
        if (inputs) { inputs[0].value = ''; inputs[1].value = ''; }
        applyLocalPred(matchId, userId, null, null);
        showToast('Reverting…');
        fetch(API + '/predictions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: userId,
            match_id: parseInt(matchId, 10),
            pred_home: NULL_SENTINEL,
            pred_away: NULL_SENTINEL
          })
        }).then(r => r.json()).then(d => {
          if (d.status === 'saved') { showToast('Reverted ✓'); setTimeout(doPoll, 200); }
          else showToast(d.error || 'Error reverting', true);
        }).catch(() => showToast('Network error', true));
        return;
      }
      if (inputs) {
        inputs[0].value = String(prevSnapshot.home);
        inputs[1].value = String(prevSnapshot.away);
      }
      applyLocalPred(matchId, userId, prevSnapshot.home, prevSnapshot.away);
      showToast('Reverting…');
      fetch(API + '/predictions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: userId,
          match_id: parseInt(matchId, 10),
          pred_home: prevSnapshot.home,
          pred_away: prevSnapshot.away
        })
      }).then(r => r.json()).then(d => {
        if (d.status === 'saved') { showToast(`Reverted to ${prevSnapshot.home}–${prevSnapshot.away} ✓`); setTimeout(doPoll, 200); }
        else showToast(d.error || 'Error reverting', true);
      }).catch(() => showToast('Network error', true));
    }
    async function doPoll() {
      if (document.hidden) return;
      try {
        const [mu, mm] = await Promise.all([
          fetch(API + '/users').then(r => r.ok ? r.json() : null).catch(() => null),
          fetch(API + '/matches').then(r => r.ok ? r.json() : null).catch(() => null)
        ]);
        if (!mu || !mm || !Array.isArray(mu) || !Array.isArray(mm)) return;
        const newUsersJson = JSON.stringify(mu);
        const newMatchesJson = JSON.stringify(mm);
        if (newUsersJson === lastUsersJson && newMatchesJson === lastMatchesJson) return;
        const oldUserIds = users.map(u => u.user_id).sort().join(',');
        const newUserIds = mu.map(u => u.user_id).sort().join(',');
        const userListChanged = oldUserIds !== newUserIds;
        const oldMatches = matches;
        users = mu;
        matches = mm;
        updateTournamentProgress();
        sortUsers();
        lastUsersJson = newUsersJson;
        lastMatchesJson = newMatchesJson;
        lastStatsHtml = '';
        lastLeaderboardHtml = '';
        if (userListChanged) buildMatchDOM();
        else patchMatchDOM(oldMatches, mm, mu);
        if (document.getElementById('leaderboard').classList.contains('active')) {
          fetch(API + '/leaderboard').then(r => r.json()).then(data => {
            if (!Array.isArray(data)) return;
            const json = JSON.stringify(data);
            if (json === lastLBJson) return;
            lastLBJson = json;
            renderLBData(data);
          }).catch(() => { });
        }
        if (document.getElementById('stats').classList.contains('active')) renderStats();
      } catch (e) { }
    }
    let fastPoll = null;
    let slowPoll = null;
    let idleTimeout = null;
    function startFastPoll() {
      if (fastPoll) return;
      fastPoll = setInterval(doPoll, 20 * 1000);
    }
    function switchToSlowPoll() {
      if (fastPoll) {
        clearInterval(fastPoll);
        fastPoll = null;
      }
      slowPoll = setInterval(doPoll, 2 * 60 * 1000);
    }
    function resetIdleTimer() {
      clearTimeout(idleTimeout);
      if (slowPoll) {
        clearInterval(slowPoll);
        slowPoll = null;
        startFastPoll();
      }
      idleTimeout = setTimeout(switchToSlowPoll, 5 * 60 * 1000);
    }
    boot();
    setInterval(updateTournamentProgress, 60 * 1000);
    setTimeout(() => {
      startFastPoll();
      resetIdleTimer();
    }, 5000);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearInterval(fastPoll); fastPoll = null;
        clearInterval(slowPoll); slowPoll = null;
      } else {
        startFastPoll();
        resetIdleTimer();
      }
    });
    document.addEventListener('click', resetIdleTimer);
    document.addEventListener('keydown', resetIdleTimer);
  </script>
</body>
