<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="preconnect" href="https://d369cipp2c.execute-api.us-east-1.amazonaws.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,700;1,800&family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" sizes="16x16" href="award-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="award-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="award-64.png">
  <link rel="icon" type="image/png" sizes="128x128" href="award-128.png">
  <link rel="icon" type="image/png" sizes="192x192" href="award-256.png">
  <link rel="apple-touch-icon" sizes="180x180" href="award-128.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <title>WC2026 Predictor</title>
  <style>
    :root {
      --paper: #f5f0e8;
      --paper2: #ede8df;
      --paper3: #e4ddd1;
      --ink: #0e0e0e;
      --ink2: #3a3730;
      --ink3: #45403a;
      --ink4: #6e6760;
      --green: #1a5c2a;
      --green-light: #e8f0ea;
      --green-mid: #c2d9c7;
      --red: #c0392b;
      --red-light: #fbecea;
      --gold: #b8860b;
      --gold-light: #fdf6e3;
      --blue: #1a3a6b;
      --blue-light: #e8eef8;
      --purple: #6b3fa0;
      --purple-light: #f0eaf7;
      --rule: rgba(14, 14, 14, 0.12);
      --rule-strong: rgba(14, 14, 14, 0.25);
      --radius: 4px;
    }
    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Barlow, sans-serif;
      font-weight: 400;
      min-height: 100vh;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }
    header {
      background: var(--ink);
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: 60px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .logo {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .logo-main {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: 1.45rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      line-height: 1;
    }
    .logo-main span {
      color: #5ddb7c;
    }
    .logo-sub {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 300;
      font-size: 0.95rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      padding-bottom: 2px;
    }
    .sync-btn {
      background: transparent;
      color: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 7px 16px;
      border-radius: var(--radius);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s;
    }
    .sync-btn:hover {
      border-color: rgba(255, 255, 255, 0.4);
      color: #fff;
    }
    .sync-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .sync-icon {
      font-size: 0.85rem;
      display: inline-block;
    }
    .sync-btn.spinning .sync-icon {
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    .tabs-wrapper {
      background: var(--ink);
      display: flex;
      align-items: stretch;
      padding: 0 28px;
      position: relative;
    }
    .tabs-list {
      display: flex;
      flex: 1;
      overflow-x: auto;
      min-width: 0;
    }
    .tabs-list::-webkit-scrollbar {
      display: none;
    }
    .sticky-shell {
      position: sticky;
      top: 0;
      z-index: 200;
      will-change: transform;
      isolation: isolate;
    }
    .tab {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      padding: 13px 20px 11px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      user-select: none;
      white-space: nowrap;
    }
    .tab:hover {
      color: rgba(255, 255, 255, 0.65);
    }
    .tab.active {
      color: #5ddb7c;
      border-bottom-color: #5ddb7c;
    }
    .search-toggle-wrap {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      padding-left: 12px;
    }
    .search-toggle {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.45);
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: var(--radius);
      transition: color 0.18s, background 0.18s;
      -webkit-tap-highlight-color: transparent;
      padding: 0;
    }
    .search-toggle:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }
    .search-toggle.active {
      color: #5ddb7c;
      background: rgba(93, 219, 124, 0.12);
    }
    .search-row-wrap {
      max-width: 780px;
      margin: 0 auto;
      padding: 0 24px;
      display: none;
    }
    .search-row-wrap.open {
      display: block;
      animation: searchSlideIn 0.25s ease both;
    }
    @keyframes searchSlideIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .search-row {
      background: #fff;
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      margin-top: 16px;
      overflow: hidden;
    }
    .search-input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
    }
    .search-input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      min-width: 0;
    }
    .search-input-icon {
      color: var(--ink4);
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .search-input-row.has-filter .search-input-icon {
      color: var(--green);
    }
    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--ink);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      height: 28px;
      width: 100%;
      min-width: 0;
    }
    .search-input::placeholder {
      color: var(--ink4);
      font-family: "Instrument Serif", serif;
      font-style: italic;
      font-weight: 400;
      font-size: 0.95rem;
      letter-spacing: 0;
    }
    .search-chip {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--green-light);
      border: 1px solid var(--green-mid);
      border-radius: var(--radius);
      padding: 4px 6px 4px 8px;
      max-width: 280px;
      margin-right: auto;
    }
    .search-input-row.has-filter .search-chip {
      display: flex;
    }
    .search-input-row.has-filter .search-input-wrap {
      display: none;
    }
    .search-chip-name {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--green);
      white-space: nowrap;
    }
    .search-chip-vs {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 0.7rem;
      color: var(--green);
      opacity: 0.65;
      font-weight: 600;
    }
    .search-chip-clear {
      background: rgba(26, 92, 42, 0.15);
      border: none;
      color: var(--green);
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      padding: 0;
      flex-shrink: 0;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .search-chip-clear:hover {
      background: rgba(26, 92, 42, 0.3);
    }
    .search-close {
      background: transparent;
      border: none;
      color: var(--ink4);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 0;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .search-close:hover {
      background: var(--paper);
      color: var(--ink);
    }
    .search-results {
      border-top: 1px solid var(--rule);
      max-height: 60vh;
      overflow-y: auto;
      padding: 6px 0;
    }
    .search-results.empty {
      display: none;
    }
    .search-section-title {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink4);
      padding: 8px 14px 4px;
    }
    .search-result {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .search-result:hover {
      background: var(--paper);
    }
    .search-result-team-name {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--ink);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .search-result-meta {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--ink4);
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }
    .search-match-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .search-match-row:hover {
      background: var(--paper);
    }
    .search-match-teams {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }
    .search-match-team {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }
    .search-match-team-name {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .search-match-vs {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 0.72rem;
      color: var(--ink4);
      font-weight: 600;
      flex-shrink: 0;
    }
    .search-match-meta {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--ink4);
      letter-spacing: 0.04em;
      flex-shrink: 0;
      text-align: right;
      white-space: nowrap;
    }
    .search-empty {
      padding: 18px 14px;
      font-family: "Instrument Serif", serif;
      font-style: italic;
      font-size: 0.9rem;
      color: var(--ink4);
      text-align: center;
    }
    main {
      max-width: 780px;
      margin: 0 auto;
      padding: 36px 24px 100px;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .stage-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 40px 0 16px;
    }
    .stage-header:first-child {
      margin-top: 0;
    }
    .stage-label {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 800;
      font-size: 0.88rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink3);
      white-space: nowrap;
    }
    .stage-rule {
      flex: 1;
      height: 1px;
      background: var(--rule);
    }
    .match-card {
      background: #fff;
      border: 1.5px solid var(--rule);
      border-radius: var(--radius);
      margin-bottom: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.18s, box-shadow 0.18s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    @media(hover:hover) {
      .match-card:hover {
        border-color: #5ddb7c;
        box-shadow: 0 0 0 3px rgba(93, 219, 124, 0.13), 0 4px 20px rgba(0, 0, 0, 0.06);
      }
    }
    .match-card.open {
      border-color: #5ddb7c;
      box-shadow: 0 0 0 3px rgba(93, 219, 124, 0.13), 0 4px 20px rgba(0, 0, 0, 0.06);
    }
    .match-row {
      display: grid;
      grid-template-columns: 1fr 130px 1fr;
      align-items: stretch;
      min-height: 72px;
    }
    .team-cell {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      min-width: 0;
      overflow: hidden;
    }
    .team-cell.home {
      justify-content: center;
      border-right: 1px solid var(--rule);
    }
    .team-cell.away {
      justify-content: center;
      border-left: 1px solid var(--rule);
    }
    .team-name {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      line-height: 1.1;
      color: var(--ink);
      text-align: center;
    }
    .centre-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 8px;
      gap: 5px;
      background: var(--paper);
      transition: background 0.18s;
    }
    .match-card.open .centre-block {
      background: var(--green-light);
    }
    .score-display {
      display: flex;
      align-items: center;
      gap: 2px;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: 2rem;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .score-num {
      color: var(--ink);
      min-width: 26px;
      text-align: center;
    }
    .score-num.final {
      color: var(--green);
    }
    .score-num.pending {
      color: var(--ink3);
      font-size: 1.4rem;
      font-weight: 400;
    }
    .score-dash {
      color: var(--ink3);
      font-weight: 400;
      font-size: 1.6rem;
      padding: 0 2px;
    }
    .match-status {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .badge {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 2px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      white-space: nowrap;
    }
    .badge.upcoming {
      background: var(--paper3);
      color: var(--ink2);
    }
    .badge.finished {
      background: var(--green-light);
      color: var(--green);
    }
    .badge.live {
      background: var(--red-light);
      color: var(--red);
      animation: blink 1.4s infinite;
    }
    @keyframes blink {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }
    .match-time {
      font-family: Barlow, sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--ink3);
      letter-spacing: 0.03em;
    }
    .predictions-panel {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.22s ease;
      background: var(--paper);
      overflow: hidden;
    }
    .predictions-panel-inner {
      overflow: hidden;
      padding: 0 20px;
      transition: padding 0.22s ease;
    }
    .match-card.open .predictions-panel {
      grid-template-rows: 1fr;
      border-top: 1px solid var(--rule);
    }
    .match-card.open .predictions-panel-inner {
      padding: 14px 20px;
    }
    .pred-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      justify-items: stretch;
    }
    .pred-item {
      background: #fff;
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.15s;
      position: relative;
    }
    .pred-item:hover {
      border-color: var(--rule-strong);
    }
    .pred-name {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 18px;
    }
    .pred-clear {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--ink4);
      cursor: pointer;
      font-family: Barlow, sans-serif;
      font-size: 14px;
      line-height: 1;
      border-radius: 50%;
      transition: background 0.15s, color 0.15s;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .pred-clear:hover {
      background: var(--red-light);
      color: var(--red);
    }
    .pred-clear:disabled {
      opacity: 0;
      pointer-events: none;
    }
    .pred-clear.hidden {
      display: none;
    }
    .pred-score-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pred-input {
      width: 42px;
      height: 40px;
      background: var(--paper);
      border: 1px solid var(--rule-strong);
      border-radius: var(--radius);
      color: var(--ink);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      text-align: center;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
      -moz-appearance: textfield;
    }
    .pred-input::-webkit-outer-spin-button,
    .pred-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
    }
    .pred-input:focus {
      border-color: var(--green);
      background: var(--green-light);
    }
    .pred-input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: transparent;
      border-color: transparent;
    }
    .pred-sep {
      color: var(--ink3);
      font-weight: 600;
      font-size: 0.9rem;
    }
    .points-pill {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 2px;
      align-self: flex-start;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .points-pill.p3 {
      background: var(--green-light);
      color: var(--green);
    }
    .points-pill.p1 {
      background: var(--blue-light);
      color: var(--blue);
    }
    .points-pill.p0 {
      background: var(--red-light);
      color: var(--red);
    }
    .points-pill.pnd {
      background: var(--paper2);
      color: var(--ink4);
    }
    .lb-wrap {
      background: #fff;
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .lb-title-row {
      padding: 20px 24px 16px;
      border-bottom: 2px solid var(--ink);
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    .lb-title {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: 1.5rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink);
      line-height: 1;
    }
    .lb-sub {
      font-family: "Instrument Serif", serif;
      font-style: italic;
      font-size: 0.85rem;
      color: var(--ink4);
    }
    .lb-header-row {
      display: grid;
      grid-template-columns: 56px 1fr 80px 56px 60px;
      padding: 8px 24px;
      background: var(--paper2);

  </div>
  <div class="filter-sheet-overlay" id="sheetOverlay" onclick="closeFilterSheet()"></div>
  <div class="filter-sheet" id="filterSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Show</div>

  </div>
  <script>
    const NULL_SENTINEL = -1;
    function isCleared(pred) {
      if (!pred) return true;
      if (pred.pred_home === undefined || pred.pred_home === null) return true;
      if (pred.pred_away === undefined || pred.pred_away === null) return true;
      if (pred.pred_home < 0 || pred.pred_away < 0) return true;
      return false;
    }
    function preloadFlags() {
      Object.values(TEAM_FLAG).forEach(code => { const img = new Image(); img.src = 'flags/' + code + '.png'; });
    }
    const TEAM_FLAG = Object.fromEntries(Object.entries({
      'United States': 'us', 'Canada': 'ca', 'Mexico': 'mx',
      'Argentina': 'ar', 'Brazil': 'br', 'Colombia': 'co',
      'Ecuador': 'ec', 'Paraguay': 'py', 'Uruguay': 'uy',
      'Austria': 'at', 'Belgium': 'be', 'Bosnia-Herzegovina': 'ba',
      'Croatia': 'hr', 'Czechia': 'cz', 'England': 'gb-eng',
      'France': 'fr', 'Germany': 'de', 'Netherlands': 'nl',
      'Norway': 'no', 'Portugal': 'pt', 'Scotland': 'gb-sct',
      'Spain': 'es', 'Sweden': 'se', 'Switzerland': 'ch',
      'Turkey': 'tr', 'Australia': 'au', 'Iran': 'ir',
      'Japan': 'jp', 'Jordan': 'jo', 'Qatar': 'qa',
      'Saudi Arabia': 'sa', 'South Korea': 'kr', 'Uzbekistan': 'uz',
      'Algeria': 'dz', 'Cape Verde Islands': 'cv', 'Egypt': 'eg',
      'Ghana': 'gh', 'Ivory Coast': 'ci', 'Morocco': 'ma',
      'Senegal': 'sn', 'South Africa': 'za', 'Tunisia': 'tn',
      'Curaçao': 'cw', 'Haiti': 'ht', 'Panama': 'pa',
      'New Zealand': 'nz', 'Congo DR': 'cd', 'Iraq': 'iq',
    }).map(([k, v]) => [k.toLowerCase(), v]));
    preloadFlags();
    function flagHtml(teamName) {
      if (!teamName) return '';
      const code = TEAM_FLAG[teamName.trim().toLowerCase()];
      if (!code) return '';
      return `<img src="flags/${code}.png" width="24" height="16" style="border-radius:2px;flex-shrink:0;display:block;border:1px solid rgba(0,0,0,0.1);" alt="${teamName}">`;
    }
    function flagHtmlSmall(teamName) {
      if (!teamName) return '';
      const code = TEAM_FLAG[teamName.trim().toLowerCase()];
      if (!code) return '';
      return `<img src="flags/${code}.png" width="18" height="12" style="border-radius:2px;flex-shrink:0;display:block;border:1px solid rgba(0,0,0,0.1);" alt="${teamName}">`;
    }
    function flagHtmlMini(teamName) {
      if (!teamName) return '';
      const code = TEAM_FLAG[teamName.trim().toLowerCase()];
      if (!code) return '';
      return `<img src="flags/${code}.png" width="14" height="10" style="border-radius:2px;flex-shrink:0;display:inline-block;vertical-align:middle;border:1px solid rgba(0,0,0,0.1);" alt="${teamName}">`;
    }
    const API = 'https://nowhere-admission-draft-adapters.trycloudflare.com';
    const STAGE_LABEL = { group: 'Group Stage', r32: 'Round of 32', r16: 'Round of 16', qf: 'Quarter Finals', sf: 'Semi Finals', third: 'Third Place', final: 'Final' };
    const STAGE_SHORT = { group: 'Group', r32: 'R32', r16: 'R16', qf: 'QF', sf: 'SF', third: '3rd', final: 'Final' };
    const PLAYER_COLORS = [
      '#10b981', '#3b82f6', '#f59e0b', '#8b5cf6',
      '#ef4444', '#06b6d4', '#ec4899', '#84cc16',
      '#f97316', '#6366f1', '#14b8a6', '#d946ef'
    ];
    const predBuffer = {};
    const timers = {};
    let matches = [], users = [];
    let toastTimer;
    let lbInitialized = false, statsInitialized = false;
    let lastLBJson = null;
    let lastMatchesJson = null;
    let lastUsersJson = null;
    let activeFilter = 'all';
    let firstRender = true;
    const FILTER_LABELS = { all: 'All Matches', today: "Today's Matches", group: 'Group Stage Matches', r32: 'Round of 32 Matches', r16: 'Round of 16 Matches', qf: 'Quarter Finals', sf: 'Semi Finals', third: 'Third Place', final: 'Final' };

    // ── DETERMINISTIC SHUFFLE (per match, stable across renders) ──
    // Uses match_id as seed so the order is randomized but doesn't keep changing on every poll.
    function hashStr(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }
    function seededShuffle(arr, seed) {
      const a = arr.slice();
      let s = seed >>> 0;
      for (let i = a.length - 1; i > 0; i--) {
        // xorshift32
        s ^= s << 13; s >>>= 0;
        s ^= s >>> 17; s >>>= 0;
        s ^= s << 5; s >>>= 0;
        const j = s % (i + 1);
        const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
      }
      return a;
    }

    function getTodayWindow() {
      const now = new Date();
      const ist = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
      const start = new Date(ist); start.setHours(0, 0, 0, 0);
      const end = new Date(ist); end.setDate(end.getDate() + 1); end.setHours(23, 59, 59, 999);
      const offset = now.getTime() - ist.getTime();
      return { start: new Date(start.getTime() + offset), end: new Date(end.getTime() + offset) };
    }
    function matchesFilter(m, filter) {
      if (filter === 'all') return true;
      if (filter === 'today') {
        const { start, end } = getTodayWindow();
        const kickoff = parseUTC(m.kickoff);
        if (!kickoff) return false;
        return kickoff >= start && kickoff <= end;
      }
      return m.stage === filter;
    }
    function getAvailableFilters() {
      const stages = [...new Set(matches.map(m => m.stage))];
      return ['all', 'today', ...stages];
    }
    function getNearestMatch() {
      const now = new Date();
      const upcoming = matches.filter(m => { const k = parseUTC(m.kickoff); return k && k > now && m.status !== 'FINISHED'; });
      if (!upcoming.length) return null;
      return upcoming.reduce((a, b) => parseUTC(a.kickoff) < parseUTC(b.kickoff) ? a : b);
    }
    function buildSheetItems() {
      const filters = getAvailableFilters();
      const container = document.getElementById('sheetItems');
      if (!container) return;
      container.innerHTML = filters.map(f => {
        const isActive = f === activeFilter;
        return `<div class="sheet-item" onclick="applyFilter('${f}')">
          <div class="sheet-item-left">
            <div class="sheet-dot ${isActive ? 'active' : ''}"></div>
            <div class="sheet-item-name ${isActive ? 'active' : ''}">${FILTER_LABELS[f] || f}</div>
          </div>
          <div class="sheet-check ${isActive ? 'active' : ''}">✓</div>
        </div>`;
      }).join('');
    }
    function openFilterSheet() {
      buildSheetItems();
      document.getElementById('sheetOverlay').classList.add('open');
      document.getElementById('filterSheet').classList.add('open');
    }
    function closeFilterSheet() {
      document.getElementById('sheetOverlay').classList.remove('open');
      document.getElementById('filterSheet').classList.remove('open');
    }
    function applyFilter(filter) {
      activeFilter = filter;
      closeFilterSheet();
      const label = document.getElementById('fabLabel');
      if (label) label.textContent = FILTER_LABELS[filter] || filter;
      expandFab();
      const container = document.getElementById('matchList');
      if (!container) return;
      let targetEl = null;
      if (filter === 'all') {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      } else if (filter === 'today') {
        const todayMatches = matches.filter(m => matchesFilter(m, 'today'));
        const targetMatch = todayMatches.length ? todayMatches[0] : getNearestMatch();
        if (targetMatch) {
          targetEl = container.querySelector(`[data-matchid="${targetMatch.match_id}"]`);
        }
      } else {
        targetEl = container.querySelector(`.stage-header[data-stage="${filter}"]`);
      }
      if (!targetEl) return;
      const stickyShell = document.querySelector('.sticky-shell');
      const stickyHeight = stickyShell ? stickyShell.offsetHeight : 0;
      const buffer = 16;
      const top = targetEl.getBoundingClientRect().top + window.scrollY - stickyHeight - buffer;
      window.scrollTo({ top, behavior: 'smooth' });
    }
    function autoSelectFilter() {
      const todayMatches = matches.filter(m => matchesFilter(m, 'today'));
      if (todayMatches.length) {
        activeFilter = 'today';
        const label = document.getElementById('fabLabel');
        if (label) label.textContent = FILTER_LABELS['today'];
      }
    }
    let fabCollapseTimer = null;
    let fabExpanded = true;
    function expandFab() {
      const btn = document.getElementById('filterFabBtn');
      if (!btn) return;
      btn.classList.remove('collapsed');
      fabExpanded = true;
      clearTimeout(fabCollapseTimer);
      fabCollapseTimer = setTimeout(collapseFab, 3500);
    }
    function collapseFab() {
      const btn = document.getElementById('filterFabBtn');
      if (!btn) return;
      btn.classList.add('collapsed');
      fabExpanded = false;
    }
    function onFabClick() {
      if (!fabExpanded) { expandFab(); return; }
      openFilterSheet();
    }
    function setFabVisibility(tabId) {
      const fab = document.getElementById('filterFab');
      if (!fab) return;
      if (tabId === 'predict' && !activeTeamFilter && !activeMatchFilter) fab.classList.remove('hidden');
      else fab.classList.add('hidden');
    }
    window.addEventListener('scroll', () => {
      const activeTab = document.querySelector('.tab-content.active');
      if (activeTab && activeTab.id === 'predict') {
        expandFab();
        clearTimeout(fabCollapseTimer);
        fabCollapseTimer = setTimeout(collapseFab, 1500);
      }
    }, { passive: true });
    function initFab() { fabCollapseTimer = setTimeout(collapseFab, 3500); }

    // ── COUNTDOWN HELPERS ──
    function computeCountdownHTML(kickoffStr, status) {
      if (status === 'FINISHED') return '';
      const kickoff = parseUTC(kickoffStr);
      if (!kickoff) return '';
      const diff = kickoff.getTime() - new Date().getTime();
      if (diff <= 0) return '';
      const totalSec = Math.floor(diff / 1000);
      const d = Math.floor(totalSec / 86400);
      const h = Math.floor((totalSec % 86400) / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      let label, dotColor;
      if (diff >= 86400000) { label = d + 'd ' + h + 'h'; dotColor = '#6e6760'; }
      else if (diff >= 3600000) { label = h + 'h ' + m + 'm'; dotColor = '#b8860b'; }
      else if (diff >= 60000) { label = m + 'm ' + s + 's'; dotColor = '#c0392b'; }
      else { label = s + 's'; dotColor = '#c0392b'; }
      return '<span style="display:inline-flex;align-items:center;gap:5px;background:var(--paper2);border-radius:20px;padding:2px 8px 2px 6px;">' +
        '<span style="width:6px;height:6px;border-radius:50%;background:' + dotColor + ';flex-shrink:0;display:inline-block;animation:blink-dot 1.2s infinite;"></span>' +
        '<span style="font-family:\'Barlow Condensed\',sans-serif;font-size:0.78rem;font-weight:700;letter-spacing:0.06em;color:' + dotColor + ';">' + label + '</span>' +
        '</span>';
    }
    function tickCountdowns() {
      document.querySelectorAll('.match-countdown').forEach(el => {
        el.innerHTML = computeCountdownHTML(el.dataset.kickoff, el.dataset.status);
      });
    }
    setInterval(tickCountdowns, 1000);

    // ── SEARCH ──
    let activeTeamFilter = null;
    let activeMatchFilter = null;
    let searchRowOpen = false;
    function getUniqueTeams() {
      const set = new Set();
      matches.forEach(m => {
        if (m.team_home && m.team_home !== 'TBD') set.add(m.team_home);
        if (m.team_away && m.team_away !== 'TBD') set.add(m.team_away);
      });
      return [...set].sort();
    }
    function searchTeams(query) {
      const q = query.trim().toLowerCase();
      if (!q) return [];
      const teams = getUniqueTeams();
      const starts = [], contains = [];
      teams.forEach(t => {
        const lc = t.toLowerCase();
        if (lc.startsWith(q)) starts.push(t);
        else if (lc.includes(q)) contains.push(t);
      });
      return [...starts, ...contains].slice(0, 5);
    }
    function searchMatchesByQuery(query) {
      const q = query.trim().toLowerCase();
      if (!q) return [];
      return matches.filter(m => {
        const h = (m.team_home || '').toLowerCase();
        const a = (m.team_away || '').toLowerCase();
        return h.includes(q) || a.includes(q);
      }).slice(0, 5);
    }
    function teamMatchCount(team) {
      return matches.filter(m => m.team_home === team || m.team_away === team).length;
    }
    function fmtShortDate(dt) {
      if (!dt) return '';
      const datePart = dt.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'Asia/Kolkata' });
      const timePart = dt.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' }).toUpperCase();
      return datePart + ' · ' + timePart;
    }
    function buildMatchResultRow(m) {
      const homeTeam = m.team_home || 'TBD';
      const awayTeam = m.team_away || 'TBD';
      const stage = STAGE_SHORT[m.stage] || m.stage;
      const kickoffDt = parseUTC(m.kickoff);
      const dateStr = fmtShortDate(kickoffDt);
      const finished = m.status === 'FINISHED';
      let scoreOrVs;
      if (finished && m.score_home !== null && m.score_away !== null && m.score_home !== undefined && m.score_away !== undefined) {
        scoreOrVs = `<span class="search-match-vs" style="color:var(--green);font-weight:800;">${m.score_home}–${m.score_away}</span>`;
      } else {
        scoreOrVs = `<span class="search-match-vs">vs</span>`;
      }
      const meta = `${stage}${dateStr ? ' · ' + dateStr : ''}`;
      return `<div class="search-match-row" onclick="selectMatchFilter('${escHtml(m.match_id)}')">
        <div class="search-match-teams">
          <div class="search-match-team">${flagHtmlSmall(homeTeam)}<span class="search-match-team-name">${escHtml(homeTeam)}</span></div>
          ${scoreOrVs}
          <div class="search-match-team">${flagHtmlSmall(awayTeam)}<span class="search-match-team-name">${escHtml(awayTeam)}</span></div>
        </div>
        <div class="search-match-meta">${meta}</div>
      </div>`;
    }
    function renderSearchResults(query) {
      const results = document.getElementById('searchResults');
      if (!results) return;
      if (!query.trim()) {
        results.innerHTML = '';
        results.classList.add('empty');
        return;
      }
      const teamHits = searchTeams(query);
      const matchHits = searchMatchesByQuery(query);
      if (!teamHits.length && !matchHits.length) {
        results.innerHTML = `<div class="search-empty">No teams or matches for "${escHtml(query)}"</div>`;
        results.classList.remove('empty');
        return;
      }
      let html = '';
      if (teamHits.length) {
        html += '<div class="search-section-title">Teams</div>';
        html += teamHits.map(t => {
          const count = teamMatchCount(t);
          const safe = escHtml(t).replace(/'/g, "\\'");
          return `<div class="search-result" onclick="selectTeamFilter('${safe}')">
            ${flagHtml(t)}
            <span class="search-result-team-name">${escHtml(t)}</span>
            <span class="search-result-meta">${count} match${count !== 1 ? 'es' : ''}</span>
          </div>`;
        }).join('');
      }
      if (matchHits.length) {
        html += '<div class="search-section-title">Matches</div>';
        html += matchHits.map(buildMatchResultRow).join('');
      }
      results.innerHTML = html;
      results.classList.remove('empty');
    }
    function toggleSearchRow() {
      if (searchRowOpen) {
        closeSearchRow();
      } else {
        openSearchRow();
      }
    }
    function openSearchRow() {
      const wrap = document.getElementById('searchRowWrap');
      const toggle = document.getElementById('searchToggle');
      const input = document.getElementById('searchInput');
      if (!wrap) return;
      wrap.classList.add('open');
      if (toggle) toggle.classList.add('active');
      searchRowOpen = true;
      setTimeout(() => { if (input) input.focus(); }, 80);
    }
    function closeSearchRow() {
      const wrap = document.getElementById('searchRowWrap');
      const toggle = document.getElementById('searchToggle');
      const input = document.getElementById('searchInput');
      const results = document.getElementById('searchResults');
      if (!wrap) return;
      wrap.classList.remove('open');
      if (toggle) toggle.classList.remove('active');
      searchRowOpen = false;
      if (input) input.value = '';
      if (results) { results.innerHTML = ''; results.classList.add('empty'); }
      if (activeTeamFilter || activeMatchFilter) {
        activeTeamFilter = null;
        activeMatchFilter = null;
        const inputRow = document.getElementById('searchInputRow');
        const chip = document.getElementById('searchChip');
        if (inputRow) inputRow.classList.remove('has-filter');
        if (chip) chip.innerHTML = '';
        setFabVisibility(getActiveTabId());
        buildMatchDOM();
      }
    }
    function selectTeamFilter(team) {
      activeTeamFilter = team;
      activeMatchFilter = null;
      const inputRow = document.getElementById('searchInputRow');
      const chip = document.getElementById('searchChip');
      const input = document.getElementById('searchInput');
      const results = document.getElementById('searchResults');
      if (input) input.value = '';
      if (results) { results.innerHTML = ''; results.classList.add('empty'); }
      if (inputRow) inputRow.classList.add('has-filter');
      if (chip) {
        chip.innerHTML = `

    // ── PREDICTION SENTENCE (randomized + inverted when majority predicted) ──
    function buildPredSentence(m, users) {
      if (!users || !users.length) return '<span style="color:var(--ink4)">No players yet</span>';
      const predicted = [];
      const notPredicted = [];
      users.forEach(u => {
        const pred = m.predictions ? m.predictions[u.user_id] : null;
        const firstName = (u.display_name || '').split(' ')[0];
        if (!isCleared(pred)) predicted.push(firstName);
        else notPredicted.push(firstName);
      });
      const total = users.length;
      if (predicted.length === 0) {
        return '<span style="color:var(--ink4)">No predictions yet</span>';
      }
      if (notPredicted.length === 0) {
        return '<span style="font-weight:800;color:var(--green)">Everyone</span> predicted &middot; ' + total + '/' + total;
      }
      // Deterministic seed per match so order is randomized but stable across re-renders
      const seed = hashStr(String(m.match_id || ''));
      // If majority have predicted (more predicted than not), invert: show who hasn't picked
      if (predicted.length > notPredicted.length) {
        const shuffled = seededShuffle(notPredicted, seed);
        let nameStr;
        if (shuffled.length > 3) {
          nameStr = shuffled.slice(0, 2).join(', ') + ' &amp; ' + (shuffled.length - 2) + ' others';
        } else {
          nameStr = shuffled.join(', ');
        }
        return '<span style="font-weight:800;color:var(--red)">' + nameStr + '</span> ' +
               (shuffled.length === 1 ? "hasn't" : "haven't") + ' predicted yet &middot; ' +
               predicted.length + '/' + total + ' in';
      }
      // Otherwise show who HAS predicted (minority/majority side both supported)
      const shuffled = seededShuffle(predicted, seed);
      let nameStr;
      if (shuffled.length > 3) {
        nameStr = shuffled.slice(0, 2).join(', ') + ' &amp; ' + (shuffled.length - 2) + ' others';
      } else {
        nameStr = shuffled.join(', ');
      }
      return '<span style="font-weight:800;color:var(--green)">' + nameStr + '</span> predicted &middot; ' +
             predicted.length + '/' + total;
    }

    function alignLastPredRow(grid) {

      let cols = 0;
      for (let i = 0; i < items.length; i++) {
        if (items[i].getBoundingClientRect().top !== firstTop) break;
        cols++;
      }
      if (cols < 1) cols = 1;
      const remainder = items.length % cols;
      if (remainder === 0) return;
      items.forEach(el => el.style.gridColumnStart = '');
      const offset = Math.floor((cols - remainder) / 2) + 1;
      for (let i = items.length - remainder; i < items.length; i++) {

      }

      let totalPredHomeGoals = 0, totalPredAwayGoals = 0, totalActualHomeGoals = 0, totalActualAwayGoals = 0;
      const predictedScorelineMap = {};
      const actualScorelineMap = {};
      const playerStats = {};
      users.forEach(u => {
        playerStats[u.user_id] = { name: u.display_name, predictions: 0, exact: 0, correct: 0, miss: 0, points: 0, predGoalsTotal: 0 };
      });

        return ka - kb;
      });

          if (!isCleared(pred) && pred.points !== undefined && pred.points !== null) {

          }
          cumulative[u.user_id].push({ idx: matchTimeline.length - 1, total: runningTotals[u.user_id] });
        });
      });
      matches.forEach(m => {
        const isFinished = m.status === 'FINISHED';
        if (isFinished && m.score_home !== undefined && m.score_away !== undefined && m.score_home !== null && m.score_away !== null) {
          totalActualHomeGoals += +m.score_home;
          totalActualAwayGoals += +m.score_away;
          const ak = normalizeScoreline(m.score_home, m.score_away);
          actualScorelineMap[ak] = (actualScorelineMap[ak] || 0) + 1;

        users.forEach(u => {
          const pred = m.predictions ? m.predictions[u.user_id] : null;
          if (!isCleared(pred)) {

    function renderHitRateDonut(s) {

    function renderScorelineHeatmap(s) {

      if (!m.predictions) m.predictions = {};
      if (ph === null && pa === null) {
        delete m.predictions[userId];
      } else {
        if (!m.predictions[userId]) m.predictions[userId] = {};
        m.predictions[userId].pred_home = ph;
        m.predictions[userId].pred_away = pa;
      }
      const sentenceEl = document.querySelector(`.pred-sentence[data-matchid="${matchId}"] .pred-sentence-txt`);
      if (sentenceEl) sentenceEl.innerHTML = buildPredSentence(m, users);
      const card = document.querySelector(`.match-card[data-matchid="${matchId}"]`);
      if (card) {
        const predItem = card.querySelector(`.pred-item[data-userid="${userId}"]`);
        if (predItem) {
          const clearBtn = predItem.querySelector('[data-role="clear"]');
          const meta = getMatchMeta(m);
          if (clearBtn) {
            const cleared = ph === null && pa === null;
            const showClear = !cleared && !meta.locked;
            clearBtn.classList.toggle('hidden', !showClear);
          }
        }
      }
      lastMatchesJson = JSON.stringify(matches);
    }
    function clearPred(matchId, userId) {
      const card = document.querySelector(`.match-card[data-matchid="${matchId}"]`);
      if (!card) return;
      const predItem = card.querySelector(`.pred-item[data-userid="${userId}"]`);
      if (!predItem) return;
      const inHome = predItem.querySelector('[data-role="input-home"]');
      const inAway = predItem.querySelector('[data-role="input-away"]');
      if (inHome) inHome.value = '';
      if (inAway) inAway.value = '';
      const key = matchId + userId;
      if (timers[key]) { clearTimeout(timers[key]); delete timers[key]; }
      delete predBuffer[key];
      applyLocalPred(matchId, userId, null, null);
      showToast('Clearing…');
      fetch(API + '/predictions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: userId,
          match_id: parseInt(matchId, 10),
          pred_home: NULL_SENTINEL,
          pred_away: NULL_SENTINEL
        })
      }).then(r => r.json()).then(d => {
        if (d.status === 'saved') {
          showToast('Cleared ✓');
          setTimeout(doPoll, 200);
        } else {
          showToast(d.error || 'Error clearing', true);
        }
      }).catch(() => showToast('Network error', true));
    }
    function savePred(input) {
      var matchId = input.dataset.matchid;
      var userId = input.dataset.userid;
      var side = input.dataset.side;
      var val = input.value.trim();
      if (!matchId || !userId || !side) return;
      var key = matchId + userId;
      var inputs = input.closest('.pred-item').querySelectorAll('.pred-input');
      var hVal = inputs[0].value.trim();
      var aVal = inputs[1].value.trim();
      if (hVal === '' && aVal === '') {
        if (timers[key]) { clearTimeout(timers[key]); delete timers[key]; }
        delete predBuffer[key];
        const m = matches.find(x => String(x.match_id) === String(matchId));
        const prevPred = m && m.predictions ? m.predictions[userId] : null;
        if (!isCleared(prevPred)) clearPred(matchId, userId);
        return;
      }
      if (hVal === '' || aVal === '') return;
      predBuffer[key] = {
        home: parseInt(hVal, 10),
        away: parseInt(aVal, 10)
      };
      if (timers[key]) clearTimeout(timers[key]);
      timers[key] = setTimeout(function () {
        var buf = predBuffer[key];
        if (!buf || buf.home === null || buf.away === null || isNaN(buf.home) || isNaN(buf.away)) return;
        showToast('Saving…');
        fetch(API + '/predictions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId, match_id: parseInt(matchId, 10), pred_home: buf.home, pred_away: buf.away })
        }).then(r => r.json()).then(d => {
          if (d.status === 'saved') {
            showToast('Saved ✓');
            applyLocalPred(matchId, userId, buf.home, buf.away);
            setTimeout(doPoll, 200);
          }
          else showToast(d.error || 'Error saving', true);
        }).catch(() => showToast('Network error', true));
      }, 500);
    }
    async function syncAll() {
      var btn = document.getElementById('syncBtn');
      var lbl = btn.querySelector('.btn-label');
      btn.disabled = true; btn.classList.add('spinning');
      if (lbl) lbl.textContent = 'Refreshing…';
      try {
        var data = await fetch(API + '/sync', { method: 'POST' }).then(r => r.json());
        showToast('Synced ' + data.count + ' match' + (data.count !== 1 ? 'es' : ''));
        const [mu, mm] = await Promise.all([
          fetch(API + '/users').then(r => r.json()),
          fetch(API + '/matches').then(r => r.json())
        ]);
        users = mu; matches = mm; sortUsers();
        lastUsersJson = JSON.stringify(users);
        lastMatchesJson = JSON.stringify(matches);
        patchMatchDOM(matches, mm, mu);
        if (document.getElementById('leaderboard').classList.contains('active')) { lbInitialized = false; renderLeaderboard(); }
        if (document.getElementById('stats').classList.contains('active')) renderStats();
      } catch (e) {
        console.error('[WC2026] sync failed:', e);
        showToast('Sync failed', true);
      } finally {
        btn.disabled = false; btn.classList.remove('spinning');
        if (lbl) lbl.textContent = 'Refresh Results';
      }
    }
    function showToast(msg, isError) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast' + (isError ? ' error' : '') + ' show';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
    }
    async function doPoll() {
      if (document.hidden) return;
      try {
        const [mu, mm] = await Promise.all([
          fetch(API + '/users').then(r => r.ok ? r.json() : null).catch(() => null),
          fetch(API + '/matches').then(r => r.ok ? r.json() : null).catch(() => null)
        ]);
        if (!mu || !mm || !Array.isArray(mu) || !Array.isArray(mm)) return;
        const newUsersJson = JSON.stringify(mu);
        const newMatchesJson = JSON.stringify(mm);
        if (newUsersJson === lastUsersJson && newMatchesJson === lastMatchesJson) return;
        const oldUserIds = users.map(u => u.user_id).sort().join(',');
        const newUserIds = mu.map(u => u.user_id).sort().join(',');
        const userListChanged = oldUserIds !== newUserIds;
        users = mu; matches = mm; sortUsers();
        lastUsersJson = newUsersJson;
        lastMatchesJson = newMatchesJson;
        if (userListChanged) {
          buildMatchDOM();
        } else {
          patchMatchDOM(matches, mm, mu);
        }
        if (document.getElementById('leaderboard').classList.contains('active')) {
          fetch(API + '/leaderboard').then(r => r.json()).then(data => {
            if (!Array.isArray(data)) return;
            const json = JSON.stringify(data);
            if (json === lastLBJson) return;
            lastLBJson = json;
            renderLBData(data);
          }).catch(() => { });
        }
        if (document.getElementById('stats').classList.contains('active')) renderStats();
      } catch (e) { }
    }
    let fastPoll = null;
    let slowPoll = null;
    let idleTimeout = null;
    function startFastPoll() { if (fastPoll) return; fastPoll = setInterval(doPoll, 20 * 1000); }
    function switchToSlowPoll() {
      if (fastPoll) { clearInterval(fastPoll); fastPoll = null; }
      slowPoll = setInterval(doPoll, 2 * 60 * 1000);
    }
    function resetIdleTimer() {
      clearTimeout(idleTimeout);
      if (slowPoll) { clearInterval(slowPoll); slowPoll = null; startFastPoll(); }
      idleTimeout = setTimeout(switchToSlowPoll, 5 * 60 * 1000);
    }
    boot();
    setTimeout(() => { startFastPoll(); resetIdleTimer(); }, 5000);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearInterval(fastPoll); fastPoll = null;
        clearInterval(slowPoll); slowPoll = null;
      } else {
        startFastPoll();
        resetIdleTimer();
      }
    });
    document.addEventListener('click', resetIdleTimer);
    document.addEventListener('keydown', resetIdleTimer);
  </script>
</body>
</html>
